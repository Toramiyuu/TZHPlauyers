<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TZH Friendly Match — Red vs Blue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  /* ============ RETRO ARCADE — VERSUS SCREEN ============ */
  :root{
    --bg:        #070510;
    --bg-2:      #0c0a1c;
    --panel:     #0f1030;
    --panel-2:   #0a0b22;
    --red:       #ff2e46;
    --red-lo:    #b30f27;
    --red-glow:  rgba(255,46,70,.55);
    --blue:      #2b8bff;
    --blue-lo:   #0e4bd6;
    --blue-glow: rgba(43,139,255,.55);
    --gold:      #ffd23f;
    --cyan:      #46f4ff;
    --green:     #3dff7d;
    --ink:       #05040c;
    --line:      rgba(70,244,255,.18);
    --edge:      #05040c;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{ background:var(--bg); }

  body{
    font-family:'VT323', monospace;
    color:#eaf6ff;
    min-height:100vh;
    background:
      radial-gradient(120% 90% at 50% -10%, #171233 0%, transparent 60%),
      radial-gradient(100% 80% at 50% 120%, #0a1233 0%, transparent 55%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    overflow-x:hidden;
    -webkit-font-smoothing:none;
  }

  /* ---- CRT overlays (scanlines + vignette + curve) ---- */
  .scanlines,
  .vignette,
  .flicker{ position:fixed; inset:0; pointer-events:none; }

  .scanlines{
    z-index:60;
    background:repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0)   0px,
      rgba(0,0,0,0)   2px,
      rgba(0,0,0,.32) 3px,
      rgba(0,0,0,.32) 4px);
    mix-blend-mode:multiply;
  }
  .vignette{
    z-index:59;
    background:radial-gradient(125% 115% at 50% 48%, transparent 52%, rgba(0,0,0,.55) 82%, rgba(0,0,0,.9) 100%);
    box-shadow:inset 0 0 190px rgba(0,0,0,.9), inset 0 0 60px rgba(0,0,0,.7);
    border-radius:22px;
  }
  .flicker{ z-index:58; background:rgba(120,200,255,.03); animation:flick 5.5s steps(2) infinite; }
  @keyframes flick{ 0%,97%{opacity:0;} 98%{opacity:.7;} 100%{opacity:0;} }

  /* faint perspective arcade grid behind everything */
  .grid-floor{
    position:fixed; left:-10%; right:-10%; bottom:-4%; height:42vh; z-index:0; pointer-events:none;
    background-image:
      linear-gradient(var(--line) 2px, transparent 2px),
      linear-gradient(90deg, var(--line) 2px, transparent 2px);
    background-size:64px 64px;
    transform:perspective(420px) rotateX(66deg);
    transform-origin:bottom center;
    opacity:.5;
    mask-image:linear-gradient(to top, #000 0%, transparent 90%);
    -webkit-mask-image:linear-gradient(to top, #000 0%, transparent 90%);
  }

  .content{
    position:relative; z-index:10;
    max-width:1720px; margin:0 auto;
    padding:clamp(16px,3vw,40px) clamp(14px,3vw,44px) clamp(40px,5vw,72px);
  }

  .press{ font-family:'Press Start 2P', monospace; line-height:1.35; }

  /* ================= TOP MARQUEE ================= */
  .marquee{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between;
    gap:12px 20px; margin-bottom:clamp(18px,3vw,34px);
  }
  .marquee__coin{
    font-size:clamp(.55rem,1.4vw,.8rem); color:var(--gold);
    letter-spacing:1px; animation:coinblink 1.05s steps(2) infinite;
  }
  @keyframes coinblink{ 50%{ opacity:.15; } }
  .credits{ font-size:clamp(1rem,2.6vw,1.5rem); color:var(--cyan); letter-spacing:1px; }
  .credits b{ color:#fff; }

  .titlewrap{ width:100%; text-align:center; }
  .title{
    font-size:clamp(1.05rem,3.6vw,2.5rem); color:#fff; letter-spacing:1px;
    text-shadow:
      0 0 4px #fff,
      3px 3px 0 var(--red-lo),
      6px 6px 0 var(--blue-lo);
  }
  .subtitle{
    margin-top:clamp(10px,1.6vw,16px);
    font-size:clamp(1.3rem,3.2vw,2rem); letter-spacing:6px; color:var(--gold);
    text-shadow:0 0 12px rgba(255,210,63,.5);
  }
  .meta{
    margin-top:6px; font-size:clamp(1.05rem,2vw,1.35rem);
    color:#9fd8ff; letter-spacing:2px;
  }
  .meta span{ color:var(--cyan); }

  /* ================= VERSUS SPLASH ================= */
  .versus{
    position:relative;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:stretch;
    gap:clamp(8px,1.4vw,18px);
    margin:clamp(20px,3vw,34px) 0 clamp(26px,4vw,44px);
  }
  .side{
    position:relative;
    border:4px solid var(--edge);
    padding:clamp(16px,2.4vw,30px) clamp(16px,2.6vw,34px);
    overflow:hidden;
    box-shadow:0 0 0 4px #000, 0 10px 0 rgba(0,0,0,.45);
  }
  .side--red{
    background:linear-gradient(135deg, #2a0710 0%, #56091d 55%, #7d0f2c 100%);
    box-shadow:0 0 0 4px #000, 0 0 34px var(--red-glow), inset 0 0 40px rgba(255,46,70,.22);
    text-align:left;
    clip-path:polygon(0 0, 100% 0, 92% 100%, 0 100%);
  }
  .side--blue{
    background:linear-gradient(225deg, #04122f 0%, #0a2f7a 55%, #0e46b8 100%);
    box-shadow:0 0 0 4px #000, 0 0 34px var(--blue-glow), inset 0 0 40px rgba(43,139,255,.22);
    text-align:right;
    clip-path:polygon(8% 0, 100% 0, 100% 100%, 0 100%);
  }
  .side__tag{ font-size:clamp(.5rem,1.3vw,.72rem); letter-spacing:1px; }
  .side--red  .side__tag{ color:#ffb3bf; }
  .side--blue .side__tag{ color:#aacdff; }
  .side__name{
    font-size:clamp(1.2rem,3.4vw,2.6rem); color:#fff; margin:10px 0 4px;
    text-shadow:3px 3px 0 #000;
  }
  .side--red  .side__name{ text-shadow:3px 3px 0 #000, 0 0 18px var(--red-glow); }
  .side--blue .side__name{ text-shadow:3px 3px 0 #000, 0 0 18px var(--blue-glow); }
  .side__cap{ font-size:clamp(1.1rem,2.1vw,1.5rem); color:#e9f4ff; letter-spacing:1px; }
  .side__cap b{ color:var(--gold); }
  .wins{ display:flex; align-items:flex-end; gap:12px; margin-top:clamp(12px,1.8vw,20px); }
  .side--blue .wins{ justify-content:flex-end; }
  .wins__num{
    font-size:clamp(2rem,6vw,4.4rem); line-height:.9;
    color:var(--gold); text-shadow:0 0 4px #fff, 4px 4px 0 #000;
  }
  .wins__lbl{ font-size:clamp(.5rem,1.3vw,.72rem); color:#fff; letter-spacing:1px; padding-bottom:6px; }

  /* center VS badge with lightning */
  .vs{ position:relative; display:flex; align-items:center; justify-content:center; min-width:clamp(70px,11vw,150px); }
  .vs__burst{
    position:absolute; inset:50% auto auto 50%; transform:translate(-50%,-50%);
    width:clamp(84px,13vw,168px); aspect-ratio:1;
    background:conic-gradient(from 0deg, var(--gold), #fff4b0, var(--gold), #ffb300, var(--gold));
    clip-path:polygon(50% 0,61% 21%,84% 12%,78% 36%,100% 43%,80% 55%,91% 78%,66% 71%,61% 96%,50% 74%,39% 96%,34% 71%,9% 78%,20% 55%,0 43%,22% 36%,16% 12%,39% 21%);
    box-shadow:0 0 26px rgba(255,210,63,.7);
    animation:spin 9s linear infinite;
  }
  @keyframes spin{ to{ transform:translate(-50%,-50%) rotate(360deg); } }
  .vs__bolt{
    position:absolute; width:clamp(20px,3vw,40px); height:clamp(46px,7vw,92px);
    background:linear-gradient(180deg,#fff,var(--cyan));
    clip-path:polygon(58% 0,20% 56%,46% 56%,30% 100%,82% 40%,54% 40%,72% 0);
    filter:drop-shadow(0 0 8px var(--cyan));
    top:50%;
  }
  .vs__bolt--l{ left:-4%;  transform:translateY(-50%) rotate(-14deg); }
  .vs__bolt--r{ right:-4%; transform:translateY(-50%) rotate(166deg); }
  .vs__txt{
    position:relative; z-index:2;
    font-size:clamp(1.5rem,5vw,3.6rem); color:#3a1000;
    text-shadow:0 2px 0 #fff6c0;
  }

  /* ================= SECTION HEADINGS ================= */
  .sec{ margin-top:clamp(28px,4vw,50px); }
  .sec__head{
    display:flex; align-items:center; gap:14px; margin-bottom:clamp(14px,2vw,22px);
  }
  .sec__head h2{
    font-size:clamp(.7rem,1.9vw,1.05rem); letter-spacing:1px; color:#fff;
    text-shadow:2px 2px 0 #000;
  }
  .sec__head .rule{ flex:1; height:4px; background:repeating-linear-gradient(90deg,var(--cyan) 0 10px, transparent 10px 20px); opacity:.55; }

  /* ================= ROSTERS / PLAYER SELECT ================= */
  .rosters{ display:grid; grid-template-columns:1fr; gap:clamp(18px,2.5vw,30px); }
  @media(min-width:900px){ .rosters{ grid-template-columns:1fr 1fr; } }

  .roster{
    border:4px solid var(--edge);
    box-shadow:0 0 0 4px #000, 0 8px 0 rgba(0,0,0,.4);
    padding:clamp(12px,1.8vw,20px);
  }
  .roster--red{  background:linear-gradient(180deg,#1a0510,#0c0210); }
  .roster--blue{ background:linear-gradient(180deg,#04102e,#020a1c); }
  .roster__title{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    font-size:clamp(.62rem,1.5vw,.82rem); margin-bottom:14px; letter-spacing:1px;
  }
  .roster--red  .roster__title{ color:var(--red); text-shadow:0 0 10px var(--red-glow); }
  .roster--blue .roster__title{ color:var(--blue); text-shadow:0 0 10px var(--blue-glow); }
  .roster__title .count{ color:#fff; opacity:.8; font-family:'VT323'; font-size:1.4rem; }

  .slots{ display:grid; grid-template-columns:repeat(2,1fr); gap:clamp(7px,1vw,11px); }
  @media(min-width:520px){ .slots{ grid-template-columns:repeat(3,1fr); } }
  @media(min-width:900px){ .slots{ grid-template-columns:repeat(2,1fr); } }
  @media(min-width:1300px){ .slots{ grid-template-columns:repeat(3,1fr); } }

  .slot{
    position:relative; display:flex; align-items:center; gap:9px;
    padding:8px 10px;
    background:linear-gradient(180deg, rgba(255,255,255,.07), rgba(0,0,0,.28));
    border:3px solid var(--slotedge);
    box-shadow:0 0 0 3px #000, inset 0 0 12px var(--slotglow);
  }
  .roster--red  .slot{ --slotedge:var(--red);  --slotglow:rgba(255,46,70,.14); }
  .roster--blue .slot{ --slotedge:var(--blue); --slotglow:rgba(43,139,255,.14); }
  .slot--cap{ --slotedge:var(--gold)!important; --slotglow:rgba(255,210,63,.22)!important; }

  .slot__port{
    flex:0 0 auto; width:30px; height:30px; display:grid; place-items:center;
    font-family:'Press Start 2P'; font-size:.5rem; color:#04040c;
    background:var(--slotedge); box-shadow:inset 0 0 0 2px #000;
  }
  .slot--cap .slot__port{ background:var(--gold); color:#2a1c00; }
  .slot__name{
    font-size:clamp(1.02rem,1.5vw,1.28rem); letter-spacing:.5px; color:#fff;
    line-height:1.05; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .slot--cap .slot__name{ color:var(--gold); }

  /* ================= COURT BATTLE CARDS ================= */
  .courts{ display:grid; grid-template-columns:repeat(auto-fit,minmax(255px,1fr)); gap:clamp(14px,2vw,22px); }

  .battle{
    position:relative; border:4px solid var(--edge);
    background:linear-gradient(180deg,#0d0e28,#070616);
    box-shadow:0 0 0 4px #000, 0 8px 0 rgba(0,0,0,.45);
    overflow:hidden;
  }
  .battle__bar{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:9px 12px; background:linear-gradient(90deg,#1b1c3d,#101127);
    border-bottom:3px solid #000;
  }
  .battle__round{ font-size:.62rem; color:var(--gold); letter-spacing:1px; }
  .battle__court{ font-family:'VT323'; font-size:1.15rem; color:#8fd3ff; letter-spacing:1px; }

  .status{ font-family:'Press Start 2P'; font-size:.5rem; padding:5px 7px; letter-spacing:1px; border:2px solid #000; }
  .status--live{ background:var(--green); color:#04180c; }
  .status--final{ background:var(--gold); color:#2a1c00; }
  .dot{ display:inline-block; animation:coinblink .8s steps(2) infinite; }

  .battle__body{ padding:clamp(12px,1.6vw,18px); }
  .fighter{ display:flex; align-items:center; gap:8px; }
  .fighter--blue{ justify-content:flex-end; text-align:right; }
  .fighter__chip{
    flex:0 0 auto; font-family:'Press Start 2P'; font-size:.46rem; letter-spacing:1px;
    padding:5px 6px; color:#fff; border:2px solid #000;
  }
  .fighter--red  .fighter__chip{ background:var(--red);  color:#2a0009; }
  .fighter--blue .fighter__chip{ background:var(--blue); color:#00122e; }
  .fighter__names{ font-size:clamp(1.05rem,1.6vw,1.32rem); text-transform:uppercase; letter-spacing:.5px; line-height:1.12; color:#fff; }
  .fighter__names small{ display:block; font-size:.82em; opacity:.72; }

  .score{
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
    gap:10px; margin:clamp(10px,1.4vw,15px) 0;
  }
  .score__n{ font-family:'Press Start 2P'; font-size:clamp(1.5rem,4vw,2.4rem); text-align:center; text-shadow:3px 3px 0 #000; }
  .score__n--red{  color:var(--red); }
  .score__n--blue{ color:var(--blue); }
  .score__n.win{ color:var(--gold); text-shadow:0 0 4px #fff,3px 3px 0 #000; }
  .score__dash{ font-family:'Press Start 2P'; font-size:clamp(.8rem,2vw,1.2rem); color:#5b6b9a; }

  .battle__foot{
    text-align:center; font-family:'Press Start 2P'; font-size:.5rem; letter-spacing:1px;
    padding:7px; border-top:3px solid #000; background:#05040f;
  }
  .foot--live{ color:var(--green); }
  .foot--final{ color:var(--gold); }
  .lead{ font-family:'VT323'; font-size:1.05rem; letter-spacing:1px; }
  .lead--red{ color:var(--red); }  .lead--blue{ color:var(--blue); }

  /* winner edge glow for finals */
  .battle.win-red{  box-shadow:0 0 0 4px #000, 0 0 26px var(--red-glow), 0 8px 0 rgba(0,0,0,.45); }
  .battle.win-blue{ box-shadow:0 0 0 4px #000, 0 0 26px var(--blue-glow), 0 8px 0 rgba(0,0,0,.45); }

  /* ================= BENCH / STANDBY ================= */
  .bench{ display:grid; grid-template-columns:1fr; gap:14px; }
  @media(min-width:900px){ .bench{ grid-template-columns:1fr 1fr; } }
  .bench__panel{
    border:3px dashed var(--bedge); padding:12px 14px; background:rgba(255,255,255,.02);
  }
  .bench--red{ --bedge:var(--red-lo); }
  .bench--blue{ --bedge:var(--blue-lo); }
  .bench__title{ font-family:'Press Start 2P'; font-size:.56rem; letter-spacing:1px; margin-bottom:10px; }
  .bench--red  .bench__title{ color:var(--red); }
  .bench--blue .bench__title{ color:var(--blue); }
  .bench__list{ display:flex; flex-wrap:wrap; gap:8px; }
  .bench__item{
    font-size:clamp(1rem,1.5vw,1.22rem); text-transform:uppercase; letter-spacing:.5px;
    color:#cfe3ff; padding:4px 9px; border:2px solid #1c2a4a; background:rgba(0,0,0,.3);
  }

  /* ================= FOOTER ================= */
  .footer{ margin-top:clamp(30px,4vw,52px); text-align:center; }
  .footer .start{ font-family:'Press Start 2P'; font-size:clamp(.6rem,1.7vw,.95rem); color:#fff; animation:coinblink 1.1s steps(2) infinite; }
  .footer .sub{ margin-top:12px; font-size:1.15rem; color:#7fb6e6; letter-spacing:2px; }
  .footer .sub b{ color:var(--gold); }

  @media (prefers-reduced-motion: reduce){
    .flicker, .marquee__coin, .dot, .vs__burst, .footer .start{ animation:none !important; }
    .vs__burst{ transform:translate(-50%,-50%); }
  }
</style>
</head>
<body>
  <div class="grid-floor"></div>

  <div class="content">
    <!-- TOP MARQUEE -->
    <header class="marquee">
      <div class="marquee__coin">INSERT COIN</div>
      <div class="credits">CREDIT <b>02</b></div>
      <div class="titlewrap">
        <div class="title press" id="title"></div>
        <div class="subtitle press" id="subtitle"></div>
        <div class="meta"><span id="date"></span> &nbsp;·&nbsp; <span id="venue"></span></div>
      </div>
    </header>

    <!-- VERSUS SPLASH -->
    <section class="versus" aria-label="Team versus">
      <div class="side side--red">
        <div class="side__tag press">PLAYER 1</div>
        <div class="side__name press" id="redName"></div>
        <div class="side__cap">CAPTAIN <b id="redCap"></b></div>
        <div class="wins">
          <div class="wins__num press" id="redWins"></div>
          <div class="wins__lbl press">GAMES<br>WON</div>
        </div>
      </div>

      <div class="vs">
        <div class="vs__burst"></div>
        <span class="vs__bolt vs__bolt--l"></span>
        <span class="vs__bolt vs__bolt--r"></span>
        <span class="vs__txt press">VS</span>
      </div>

      <div class="side side--blue">
        <div class="side__tag press">PLAYER 2</div>
        <div class="side__name press" id="blueName"></div>
        <div class="side__cap">CAPTAIN <b id="blueCap"></b></div>
        <div class="wins">
          <div class="wins__num press" id="blueWins"></div>
          <div class="wins__lbl press">GAMES<br>WON</div>
        </div>
      </div>
    </section>

    <!-- ROSTERS -->
    <section class="sec">
      <div class="sec__head"><h2 class="press">PLAYER SELECT</h2><span class="rule"></span></div>
      <div class="rosters">
        <div class="roster roster--red">
          <div class="roster__title press">RED TEAM <span class="count">×12</span></div>
          <div class="slots" id="redSlots"></div>
        </div>
        <div class="roster roster--blue">
          <div class="roster__title press">BLUE TEAM <span class="count">×12</span></div>
          <div class="slots" id="blueSlots"></div>
        </div>
      </div>
    </section>

    <!-- COURTS -->
    <section class="sec">
      <div class="sec__head"><h2 class="press">NOW BATTLING</h2><span class="rule"></span></div>
      <div class="courts" id="courts"></div>
    </section>

    <!-- BENCH -->
    <section class="sec">
      <div class="sec__head"><h2 class="press">STANDBY</h2><span class="rule"></span></div>
      <div class="bench">
        <div class="bench__panel bench--red">
          <div class="bench__title">RED BENCH</div>
          <div class="bench__list" id="redBench"></div>
        </div>
        <div class="bench__panel bench--blue">
          <div class="bench__title">BLUE BENCH</div>
          <div class="bench__list" id="blueBench"></div>
        </div>
      </div>
    </section>

    <footer class="footer">
      <div class="start">PRESS START · GAME ON</div>
      <div class="sub"><b>TZH</b> BADMINTON ARENA · RED VS BLUE</div>
    </footer>
  </div>

  <!-- CRT overlays -->
  <div class="grid-floor" aria-hidden="true"></div>
  <div class="flicker" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>

<script>
const MATCH = {
  title: "TZH Friendly Match", subtitle: "Red vs Blue",
  date: "Monday 13 July 2026", venue: "TZH Badminton Arena",
  red:  { name: "Red Team",  games: 6, captain: "Wei Jie" },
  blue: { name: "Blue Team", games: 5, captain: "Zhang Hao" },
  redPlayers:  ["Wei Jie (C)","Marcus Tan","Kenji Wong","Arjun Rao","Daniel Lim","Ryan Ng","Samuel Goh","Ethan Chua","Lucas Teo","Nathan Sim","Oliver Yeo","Isaac Loh"],
  bluePlayers: ["Zhang Hao (C)","Aaron Koh","Bryan Ho","Vikram Nair","Julian Toh","Leon Tay","Adrian Ong","Felix Low","Gabriel See","Sean Chan","Dylan Foo","Caleb Wee"],
  courts: [
    { court: 1, red: ["Wei Jie","Marcus Tan"],   blue: ["Zhang Hao","Aaron Koh"],  red_score: 21, blue_score: 18, status: "Final" },
    { court: 2, red: ["Kenji Wong","Arjun Rao"],  blue: ["Bryan Ho","Vikram Nair"], red_score: 15, blue_score: 19, status: "Live" },
    { court: 3, red: ["Daniel Lim","Ryan Ng"],    blue: ["Julian Toh","Leon Tay"],  red_score: 11, blue_score: 9,  status: "Live" },
    { court: 4, red: ["Samuel Goh","Ethan Chua"], blue: ["Adrian Ong","Felix Low"], red_score: 8,  blue_score: 14, status: "Live" }
  ],
  redBench:  ["Lucas Teo","Nathan Sim","Oliver Yeo","Isaac Loh"],
  blueBench: ["Gabriel See","Sean Chan","Dylan Foo","Caleb Wee"]
};

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');

// ---- header / versus ----
$('title').textContent    = MATCH.title.toUpperCase();
$('subtitle').textContent = MATCH.subtitle.toUpperCase();
$('date').textContent     = MATCH.date;
$('venue').textContent    = MATCH.venue;
$('redName').textContent  = MATCH.red.name.toUpperCase();
$('blueName').textContent = MATCH.blue.name.toUpperCase();
$('redCap').textContent   = MATCH.red.captain.toUpperCase();
$('blueCap').textContent  = MATCH.blue.captain.toUpperCase();
$('redWins').textContent  = pad(MATCH.red.games);
$('blueWins').textContent = pad(MATCH.blue.games);

// ---- rosters (PLAYER SELECT slots) ----
function renderRoster(list, mountId){
  const mount = $(mountId);
  list.forEach((raw, i) => {
    const isCap = /\(C\)/.test(raw);
    const name  = raw.replace(/\s*\(C\)\s*/,'').trim();
    const el = document.createElement('div');
    el.className = 'slot' + (isCap ? ' slot--cap' : '');
    el.innerHTML =
      '<span class="slot__port">' + (isCap ? '1P' : pad(i+1)) + '</span>' +
      '<span class="slot__name" title="'+name+'">' + name + '</span>';
    mount.appendChild(el);
  });
}
renderRoster(MATCH.redPlayers,  'redSlots');
renderRoster(MATCH.bluePlayers, 'blueSlots');

// ---- court battle cards ----
const courtsMount = $('courts');
MATCH.courts.forEach(c => {
  const isFinal = /final/i.test(c.status);
  const redWin  = c.red_score > c.blue_score;
  const winClass = isFinal ? (redWin ? 'win-red' : 'win-blue') : '';

  const statusHTML = isFinal
    ? '<span class="status status--final">K.O. / FINAL</span>'
    : '<span class="status status--live"><span class="dot">●</span> LIVE</span>';

  const footHTML = isFinal
    ? '<div class="battle__foot foot--final">FINAL &nbsp;·&nbsp; <span class="lead lead-'+(redWin?'red':'blue')+'">'+
        (redWin ? MATCH.red.name : MATCH.blue.name).toUpperCase()+' TAKES THE GAME</span></div>'
    : '<div class="battle__foot foot--live">FIGHT! &nbsp;·&nbsp; <span class="lead lead-'+(c.red_score>=c.blue_score?'red':'blue')+'">'+
        (c.red_score===c.blue_score ? 'DEAD EVEN' : (c.red_score>c.blue_score ? 'RED LEADS':'BLUE LEADS'))+'</span></div>';

  const card = document.createElement('div');
  card.className = 'battle ' + winClass;
  card.innerHTML =
    '<div class="battle__bar">' +
      '<span class="battle__round press">ROUND '+c.court+'</span>' +
      '<span class="battle__court">COURT '+c.court+'</span>' +
      statusHTML +
    '</div>' +
    '<div class="battle__body">' +
      '<div class="fighter fighter--red">' +
        '<span class="fighter__chip">RED</span>' +
        '<span class="fighter__names">'+c.red[0].toUpperCase()+'<small>'+c.red[1].toUpperCase()+'</small></span>' +
      '</div>' +
      '<div class="score">' +
        '<span class="score__n score__n--red '+(isFinal&&redWin?'win':'')+'">'+pad(c.red_score)+'</span>' +
        '<span class="score__dash">–</span>' +
        '<span class="score__n score__n--blue '+(isFinal&&!redWin?'win':'')+'">'+pad(c.blue_score)+'</span>' +
      '</div>' +
      '<div class="fighter fighter--blue">' +
        '<span class="fighter__names">'+c.blue[0].toUpperCase()+'<small>'+c.blue[1].toUpperCase()+'</small></span>' +
        '<span class="fighter__chip">BLUE</span>' +
      '</div>' +
    '</div>' +
    footHTML;
  courtsMount.appendChild(card);
});

// ---- bench ----
function renderBench(list, mountId){
  const mount = $(mountId);
  list.forEach(n => {
    const el = document.createElement('span');
    el.className = 'bench__item';
    el.textContent = n;
    mount.appendChild(el);
  });
}
renderBench(MATCH.redBench,  'redBench');
renderBench(MATCH.blueBench, 'blueBench');
</script>
</body>
</html>
