<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TZH Friendly Match — Red vs Blue • LED Jumbotron</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Micro+5&family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
<style>
  /* Seven-segment LED font (CDN CSS + woff, no JS). Falls back to mono glow if offline. */
  @import url('https://cdn.jsdelivr.net/npm/dseg@0.46.0/css/dseg.css');

  :root{
    --bg:      #050608;
    --panel:   #0b0e13;
    --panel2:  #070a0e;
    --bezel:   #1a212b;
    --ink:     #cdd6e2;
    --dim:     #6b7686;

    --red:     #ff3b30;
    --red-lit: #ff6a5f;
    --blue:    #2f9bff;
    --blue-lit:#66b8ff;
    --amber:   #ffb300;

    --seg-font: "DSEG7 Classic", "Share Tech Mono", monospace;
    --grid: 3px;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{ height:100%; }

  body{
    background:
      radial-gradient(120% 90% at 50% -10%, #0d1119 0%, #070a0f 45%, var(--bg) 100%);
    color:var(--ink);
    font-family:"Share Tech Mono", ui-monospace, monospace;
    min-height:100dvh;
    padding: clamp(10px, 2.2vw, 34px);
    -webkit-font-smoothing:antialiased;
    letter-spacing:.02em;
  }

  /* faint LED pixel-matrix overlay + scanlines across the whole arena screen */
  body::before{
    content:"";
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      radial-gradient(circle at center, rgba(255,255,255,.045) 0.7px, transparent 0.9px),
      repeating-linear-gradient(0deg, rgba(0,0,0,.30) 0 1px, transparent 1px 3px);
    background-size: var(--grid) var(--grid), 100% 3px;
    mix-blend-mode:screen;
    opacity:.55;
  }

  .stage{
    position:relative; z-index:1;
    max-width: 1680px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    gap: clamp(12px, 1.6vw, 24px);
  }

  /* ---------- PANEL / BEZEL ---------- */
  .panel{
    position:relative;
    background:
      linear-gradient(180deg, var(--panel) 0%, var(--panel2) 100%);
    border:1px solid var(--bezel);
    border-radius:16px;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.05),
      inset 0 0 60px rgba(0,0,0,.8),
      0 24px 60px rgba(0,0,0,.6);
  }
  /* corner rivets on framed boards */
  .riveted::before, .riveted::after{
    content:""; position:absolute; width:7px; height:7px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #3a434f, #10151b 70%);
    box-shadow: inset 0 0 2px rgba(0,0,0,.9);
    top:12px;
  }
  .riveted::before{ left:12px; }
  .riveted::after{ right:12px; }

  /* panel inner LED grid */
  .ledface{
    position:relative; overflow:hidden;
  }
  .ledface::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    background-image:
      radial-gradient(circle at center, rgba(255,255,255,.05) 0.7px, transparent 0.9px);
    background-size: var(--grid) var(--grid);
    opacity:.6;
  }

  /* ---------- LED SEVEN-SEGMENT DIGITS ---------- */
  .led{
    position:relative; display:inline-block; line-height:1;
    font-family:var(--seg-font);
    font-size:1em; letter-spacing:.02em;
  }
  .led .g{ opacity:.10; }          /* dim "off" segments ghost */
  .led .v{ position:absolute; left:0; top:0; }
  .led-red  .v{ color:var(--red-lit);  text-shadow:0 0 .05em var(--red),  0 0 .28em rgba(255,59,48,.85), 0 0 .7em rgba(255,59,48,.45); }
  .led-blue .v{ color:var(--blue-lit); text-shadow:0 0 .05em var(--blue), 0 0 .28em rgba(47,155,255,.85), 0 0 .7em rgba(47,155,255,.45); }
  .led-red  .g{ color:var(--red); }
  .led-blue .g{ color:var(--blue); }
  .led.lo .v{ opacity:.42; text-shadow:0 0 .04em currentColor; } /* losing / trailing score dimmed */

  /* dot-matrix marquee-style neutral text */
  .dotmatrix{ font-family:"Micro 5", "Share Tech Mono", monospace; }

  /* ---------- TOP BAR ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    gap:16px; flex-wrap:wrap;
    padding: clamp(12px,1.6vw,20px) clamp(16px,2.4vw,34px);
  }
  .brand{ display:flex; flex-direction:column; gap:4px; min-width:0; }
  .brand h1{
    font-family:"Orbitron", sans-serif; font-weight:900;
    font-size: clamp(1.15rem, 2.9vw, 2.4rem);
    letter-spacing:.06em; color:#fff;
    text-shadow:0 0 18px rgba(255,179,0,.25);
    line-height:1;
  }
  .brand .sub{
    font-family:"Micro 5", monospace;
    font-size: clamp(1.3rem, 3.4vw, 2.3rem);
    line-height:.9; letter-spacing:.04em;
  }
  .brand .sub .r{ color:var(--red-lit); text-shadow:0 0 12px rgba(255,59,48,.6); }
  .brand .sub .b{ color:var(--blue-lit); text-shadow:0 0 12px rgba(47,155,255,.6); }
  .brand .sub .v{ color:var(--amber); }

  .meta{ display:flex; align-items:center; gap: clamp(10px,1.6vw,22px); flex-wrap:wrap; justify-content:flex-end; }
  .meta .mline{ text-align:right; line-height:1.35; }
  .meta .mline .k{ color:var(--dim); font-size:.62rem; letter-spacing:.22em; text-transform:uppercase; }
  .meta .mline .val{ color:var(--amber); font-size: clamp(.72rem,1.3vw,.95rem); letter-spacing:.08em; text-shadow:0 0 10px rgba(255,179,0,.35); }
  .livepill{
    display:inline-flex; align-items:center; gap:8px;
    padding:8px 14px; border-radius:8px;
    border:1px solid rgba(255,59,48,.4);
    background:linear-gradient(180deg, rgba(255,59,48,.14), rgba(255,59,48,.04));
    color:var(--red-lit); font-family:"Orbitron",sans-serif; font-weight:700;
    letter-spacing:.24em; font-size:.72rem;
    box-shadow:inset 0 0 18px rgba(255,59,48,.15);
  }
  .livepill .dot{ width:9px; height:9px; border-radius:50%; background:var(--red);
    box-shadow:0 0 10px var(--red),0 0 18px rgba(255,59,48,.7); animation:blink 1.1s steps(1) infinite; }

  /* ---------- MARQUEE STRIP ---------- */
  .marquee{
    overflow:hidden; white-space:nowrap;
    border-top:1px solid var(--bezel); border-bottom:1px solid var(--bezel);
    background:linear-gradient(180deg,#080b10,#05070a);
    padding:7px 0;
  }
  .marquee .track{
    display:inline-block; will-change:transform;
    animation: scroll 26s linear infinite;
    font-family:"Micro 5", monospace;
    font-size: clamp(1.2rem,2.4vw,1.7rem);
    color:var(--amber); letter-spacing:.05em;
    text-shadow:0 0 10px rgba(255,179,0,.4);
  }
  .marquee .track span{ padding:0 1.4rem; }
  .marquee .track .rr{ color:var(--red-lit); }
  .marquee .track .bb{ color:var(--blue-lit); }

  /* ---------- JUMBOTRON HERO ---------- */
  .jumbotron{
    display:grid;
    grid-template-columns: 1fr auto 1fr;
    align-items:center;
    gap: clamp(8px, 2vw, 40px);
    padding: clamp(18px, 3vw, 52px) clamp(16px, 3vw, 60px);
  }
  .jb-side{ display:flex; flex-direction:column; align-items:center; gap: clamp(4px,.8vw,10px); text-align:center; min-width:0; }
  .jb-team{ font-family:"Orbitron",sans-serif; font-weight:900; letter-spacing:.14em;
    font-size: clamp(1rem, 2.4vw, 2rem); }
  .jb-side.red  .jb-team{ color:var(--red-lit);  text-shadow:0 0 20px rgba(255,59,48,.5); }
  .jb-side.blue .jb-team{ color:var(--blue-lit); text-shadow:0 0 20px rgba(47,155,255,.5); }
  .jb-cap{ color:var(--dim); font-size:.66rem; letter-spacing:.2em; text-transform:uppercase; }
  .jb-cap b{ color:var(--amber); font-weight:400; }
  .jb-score{ font-size: clamp(4.6rem, 17vw, 13rem); margin-top: clamp(2px,.6vw,10px); }

  .jb-mid{ display:flex; flex-direction:column; align-items:center; gap: clamp(8px,1.2vw,16px); }
  .jb-vs{
    font-family:"Orbitron",sans-serif; font-weight:900;
    font-size: clamp(1.4rem, 3.6vw, 3rem); color:#fff;
    text-shadow:0 0 22px rgba(255,255,255,.25); letter-spacing:.06em;
  }
  .jb-lab{ font-family:"Micro 5",monospace; color:var(--amber); letter-spacing:.14em;
    font-size: clamp(1.1rem,2vw,1.6rem); text-shadow:0 0 10px rgba(255,179,0,.4); }
  .jb-lead{
    display:inline-flex; align-items:center; gap:8px;
    padding:6px 14px; border-radius:999px;
    border:1px solid rgba(255,179,0,.35);
    background:rgba(255,179,0,.06);
    color:var(--amber); font-size:.68rem; letter-spacing:.18em; text-transform:uppercase;
    white-space:nowrap;
  }
  .jb-lead .swatch{ width:8px; height:8px; border-radius:2px; box-shadow:0 0 8px currentColor; }

  /* ---------- SECTION TITLES ---------- */
  .section-title{
    font-family:"Orbitron",sans-serif; font-weight:700; letter-spacing:.26em;
    text-transform:uppercase; color:#e9eef5;
    font-size: clamp(.78rem, 1.5vw, 1.05rem);
    display:flex; align-items:center; gap:14px;
    margin: clamp(4px,.8vw,10px) 4px clamp(2px,.4vw,6px);
  }
  .section-title::before{ content:""; width:12px; height:12px; border-radius:2px;
    background:var(--amber); box-shadow:0 0 12px var(--amber); }
  .section-title::after{ content:""; flex:1; height:1px;
    background:linear-gradient(90deg, var(--bezel), transparent); }

  /* ---------- COURT ROWS ---------- */
  .courts{ display:flex; flex-direction:column; gap: clamp(8px,1.1vw,14px); }
  .court{
    display:grid;
    grid-template-columns: clamp(70px,7vw,110px) 1fr auto 1fr clamp(76px,7vw,104px);
    grid-template-areas:"num red score blue status";
    align-items:center;
    gap: clamp(6px, 1.4vw, 22px);
    padding: clamp(10px,1.4vw,18px) clamp(12px,1.8vw,26px);
  }
  .c-num{ grid-area:num; display:flex; flex-direction:column; align-items:flex-start; line-height:1; }
  .c-num .c-lab{ font-family:"Micro 5",monospace; color:var(--dim); font-size: clamp(.9rem,1.5vw,1.15rem); letter-spacing:.08em; }
  .c-num .c-no{ font-family:"Orbitron",sans-serif; font-weight:900; color:var(--amber);
    font-size: clamp(1.6rem,3vw,2.6rem); text-shadow:0 0 14px rgba(255,179,0,.5); line-height:.9; }

  .side{ display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px; min-width:0; }
  .c-red{ grid-area:red; justify-content:flex-end; text-align:right; }
  .c-blue{ grid-area:blue; justify-content:flex-start; text-align:left; }
  .side .nm{ font-size: clamp(.82rem,1.35vw,1.1rem); color:#e7edf5; letter-spacing:.02em; white-space:nowrap; }
  .c-red .nm{ text-shadow:0 0 10px rgba(255,59,48,.18); }
  .c-blue .nm{ text-shadow:0 0 10px rgba(47,155,255,.18); }
  .side .amp{ color:var(--dim); font-size:.8em; }

  .c-score{ grid-area:score; display:flex; align-items:center; gap: clamp(6px,1vw,14px);
    font-size: clamp(1.7rem, 4vw, 3.1rem); }
  .c-score .colon{ font-family:"Orbitron",sans-serif; color:var(--amber); font-size:.7em;
    transform:translateY(-.06em); text-shadow:0 0 12px rgba(255,179,0,.5); }

  .c-status{ grid-area:status; justify-self:end; display:inline-flex; align-items:center; gap:7px;
    font-family:"Orbitron",sans-serif; font-weight:700; letter-spacing:.16em; font-size:.66rem;
    padding:6px 10px; border-radius:7px; border:1px solid transparent; white-space:nowrap; }
  .c-status.live{ color:var(--amber); border-color:rgba(255,179,0,.4);
    background:rgba(255,179,0,.06); box-shadow:inset 0 0 14px rgba(255,179,0,.12); }
  .c-status.live .dot{ width:8px; height:8px; border-radius:50%; background:var(--amber);
    box-shadow:0 0 10px var(--amber),0 0 16px rgba(255,179,0,.7); animation:blink 1s steps(1) infinite; }
  .c-status.final{ color:var(--dim); border-color:var(--bezel); background:rgba(255,255,255,.02); }

  /* ---------- LINE-UP BOARD ---------- */
  .lineup{ display:grid; grid-template-columns:1fr 1fr; gap: clamp(10px,1.4vw,18px); }
  .team-col{ padding: clamp(12px,1.6vw,20px); }
  .team-head{ display:flex; align-items:baseline; justify-content:space-between; gap:10px;
    padding-bottom:10px; margin-bottom:8px; border-bottom:1px solid var(--bezel); flex-wrap:wrap; }
  .th-name{ font-family:"Orbitron",sans-serif; font-weight:900; letter-spacing:.1em;
    font-size: clamp(1rem,2vw,1.5rem); }
  .th-cap{ font-size:.62rem; letter-spacing:.16em; color:var(--dim); text-transform:uppercase; }
  .th-cap b{ color:var(--amber); font-weight:400; }
  .team-col.red  .th-name{ color:var(--red-lit);  text-shadow:0 0 16px rgba(255,59,48,.45); }
  .team-col.blue .th-name{ color:var(--blue-lit); text-shadow:0 0 16px rgba(47,155,255,.45); }

  .plist{ list-style:none; display:grid; gap:2px; }
  .p{ display:flex; align-items:center; gap:10px; padding:7px 8px; border-radius:6px; }
  .p:nth-child(odd){ background:rgba(255,255,255,.015); }
  .bullet{ width:7px; height:7px; border-radius:50%; flex:0 0 auto; box-shadow:0 0 8px currentColor; }
  .team-col.red  .bullet{ color:var(--red);  background:var(--red); }
  .team-col.blue .bullet{ color:var(--blue); background:var(--blue); }
  .p-name{ flex:1; font-size: clamp(.86rem,1.3vw,1.05rem); color:#eaf0f7; letter-spacing:.03em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .p.cap .p-name{ color:#fff; font-weight:700; }
  .capflag{ font-family:"Orbitron",sans-serif; font-weight:900; font-size:.6rem;
    color:#050608; background:var(--amber); border-radius:4px; padding:2px 5px; letter-spacing:.06em;
    box-shadow:0 0 12px rgba(255,179,0,.55); flex:0 0 auto; }
  .p-tag{ font-family:"Micro 5",monospace; font-size:1rem; letter-spacing:.06em; flex:0 0 auto;
    padding:1px 8px; border-radius:5px; min-width:52px; text-align:center; }
  .team-col.red  .p-tag.on{ color:var(--red-lit);  border:1px solid rgba(255,59,48,.35); background:rgba(255,59,48,.07); }
  .team-col.blue .p-tag.on{ color:var(--blue-lit); border:1px solid rgba(47,155,255,.35); background:rgba(47,155,255,.07); }
  .p-tag.bench{ color:var(--dim); border:1px solid var(--bezel); background:rgba(255,255,255,.02); }

  /* ---------- FOOTER ---------- */
  footer{ text-align:center; color:var(--dim); font-size:.66rem; letter-spacing:.22em;
    text-transform:uppercase; padding: 6px 0 4px; }
  footer b{ color:var(--amber); font-weight:400; }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 860px){
    .jumbotron{ grid-template-columns:1fr; gap:16px; }
    .jb-mid{ order:2; }
    .jb-side.blue{ order:3; }
    .jb-score{ font-size: clamp(5rem, 34vw, 9rem); }

    .lineup{ grid-template-columns:1fr; }

    .court{
      grid-template-columns: 1fr auto 1fr;
      grid-template-areas:
        "num  num    status"
        "red  score  blue";
      gap:6px 10px;
      row-gap:12px;
    }
    .c-num{ flex-direction:row; align-items:baseline; gap:8px; }
    .c-red{ justify-content:flex-start; text-align:left; }
    .side{ flex-direction:column; align-items:stretch; gap:2px; }
    .c-red .side, .c-red.side{ align-items:flex-start; }
    .c-blue.side{ align-items:flex-end; text-align:right; }
    .side .amp{ display:none; }
    .side .nm{ white-space:normal; }
    .c-score{ justify-content:center; font-size: clamp(2.1rem,11vw,3.4rem); }
    .c-status{ justify-self:end; }
    .meta{ width:100%; justify-content:flex-start; }
    .meta .mline{ text-align:left; }
  }

  @media (max-width: 420px){
    body{ padding:8px; --grid:2.5px; }
    .topbar{ flex-direction:column; align-items:flex-start; }
  }

  @keyframes blink{ 0%,49%{opacity:1} 50%,100%{opacity:.15} }
  @keyframes scroll{ from{transform:translateX(0)} to{transform:translateX(-50%)} }

  @media (prefers-reduced-motion: reduce){
    .marquee .track{ animation:none; }
    .livepill .dot, .c-status.live .dot{ animation:none; }
  }
</style>
</head>
<body>
  <main class="stage">

    <!-- TOP BAR -->
    <header class="topbar panel riveted ledface">
      <div class="brand">
        <h1 id="title">TZH FRIENDLY MATCH</h1>
        <div class="sub"><span class="r">RED</span> <span class="v">vs</span> <span class="b">BLUE</span></div>
      </div>
      <div class="meta">
        <div class="mline"><div class="k">Date</div><div class="val" id="date">—</div></div>
        <div class="mline"><div class="k">Venue</div><div class="val" id="venue">—</div></div>
        <div class="livepill"><span class="dot"></span>LIVE</div>
      </div>
    </header>

    <!-- MARQUEE -->
    <div class="marquee panel">
      <div class="track" id="marquee"></div>
    </div>

    <!-- JUMBOTRON GAMES TALLY -->
    <section class="jumbotron panel riveted ledface" aria-label="Team games tally">
      <div class="jb-side red">
        <div class="jb-team" id="redName">RED TEAM</div>
        <div class="jb-cap">CAPT · <b id="redCap">—</b></div>
        <div class="jb-score" id="redScore"></div>
      </div>
      <div class="jb-mid">
        <div class="jb-vs">VS</div>
        <div class="jb-lab">GAMES WON</div>
        <div class="jb-lead" id="lead"><span class="swatch"></span><span id="leadTxt">—</span></div>
      </div>
      <div class="jb-side blue">
        <div class="jb-team" id="blueName">BLUE TEAM</div>
        <div class="jb-cap">CAPT · <b id="blueCap">—</b></div>
        <div class="jb-score" id="blueScore"></div>
      </div>
    </section>

    <!-- LIVE COURTS -->
    <section aria-label="Live court matchups">
      <h2 class="section-title">Live Courts</h2>
      <div class="courts" id="courts"></div>
    </section>

    <!-- STARTING LINE-UP -->
    <section aria-label="Starting line-up">
      <h2 class="section-title">Starting Line-up</h2>
      <div class="lineup">
        <div class="team-col red panel riveted ledface" id="redCol"></div>
        <div class="team-col blue panel riveted ledface" id="blueCol"></div>
      </div>
    </section>

    <footer>TZH Badminton Arena &nbsp;·&nbsp; <b>24 Players</b> &nbsp;·&nbsp; 4 Courts Live</footer>
  </main>

  <script>
    const MATCH = {
      title: "TZH Friendly Match", subtitle: "Red vs Blue",
      date: "Monday 13 July 2026", venue: "TZH Badminton Arena",
      red:  { name: "Red Team",  games: 6, captain: "Wei Jie" },
      blue: { name: "Blue Team", games: 5, captain: "Zhang Hao" },
      redPlayers:  ["Wei Jie (C)","Marcus Tan","Kenji Wong","Arjun Rao","Daniel Lim","Ryan Ng","Samuel Goh","Ethan Chua","Lucas Teo","Nathan Sim","Oliver Yeo","Isaac Loh"],
      bluePlayers: ["Zhang Hao (C)","Aaron Koh","Bryan Ho","Vikram Nair","Julian Toh","Leon Tay","Adrian Ong","Felix Low","Gabriel See","Sean Chan","Dylan Foo","Caleb Wee"],
      courts: [
        { court: 1, red: ["Wei Jie","Marcus Tan"],   blue: ["Zhang Hao","Aaron Koh"],  red_score: 21, blue_score: 18, status: "Final" },
        { court: 2, red: ["Kenji Wong","Arjun Rao"],  blue: ["Bryan Ho","Vikram Nair"], red_score: 15, blue_score: 19, status: "Live" },
        { court: 3, red: ["Daniel Lim","Ryan Ng"],    blue: ["Julian Toh","Leon Tay"],  red_score: 11, blue_score: 9,  status: "Live" },
        { court: 4, red: ["Samuel Goh","Ethan Chua"], blue: ["Adrian Ong","Felix Low"], red_score: 8,  blue_score: 14, status: "Live" }
      ],
      redBench:  ["Lucas Teo","Nathan Sim","Oliver Yeo","Isaac Loh"],
      blueBench: ["Gabriel See","Sean Chan","Dylan Foo","Caleb Wee"]
    };

    // Build seven-segment LED number: dim "8" ghost behind the lit value.
    function led(value, team, dim){
      const v = String(value);
      const ghost = "8".repeat(v.length);
      return `<span class="led led-${team}${dim ? " lo" : ""}"><span class="g">${ghost}</span><span class="v">${v}</span></span>`;
    }

    // Map on-court players -> court label (used for line-up status tags).
    const courtMap = {};
    MATCH.courts.forEach(c=>{
      c.red.forEach(n=> courtMap[n] = "C" + c.court);
      c.blue.forEach(n=> courtMap[n] = "C" + c.court);
    });

    // ---- header meta ----
    document.getElementById("title").textContent = MATCH.title.toUpperCase();
    document.getElementById("date").textContent  = MATCH.date;
    document.getElementById("venue").textContent  = MATCH.venue;

    // ---- marquee ----
    const mq = `<span>TZH FRIENDLY MATCH</span><span class="rr">RED TEAM</span><span>vs</span><span class="bb">BLUE TEAM</span><span>${MATCH.date.toUpperCase()}</span><span>${MATCH.venue.toUpperCase()}</span>`;
    document.getElementById("marquee").innerHTML = mq + mq; // doubled for seamless loop

    // ---- jumbotron tally ----
    document.getElementById("redName").textContent  = MATCH.red.name.toUpperCase();
    document.getElementById("blueName").textContent = MATCH.blue.name.toUpperCase();
    document.getElementById("redCap").textContent   = MATCH.red.captain;
    document.getElementById("blueCap").textContent  = MATCH.blue.captain;
    document.getElementById("redScore").innerHTML   = led(MATCH.red.games, "red");
    document.getElementById("blueScore").innerHTML  = led(MATCH.blue.games, "blue");

    // leader readout (derived from the tally, not invented)
    (function(){
      const dr = MATCH.red.games - MATCH.blue.games;
      const el = document.getElementById("lead");
      const txt = document.getElementById("leadTxt");
      const sw  = el.querySelector(".swatch");
      if(dr === 0){
        txt.textContent = "All Square";
        sw.style.color = "var(--amber)";
      } else {
        const redLead = dr > 0;
        txt.textContent = `${redLead ? "Red" : "Blue"} leads +${Math.abs(dr)}`;
        el.style.borderColor = redLead ? "rgba(255,59,48,.4)" : "rgba(47,155,255,.4)";
        el.style.color = redLead ? "var(--red-lit)" : "var(--blue-lit)";
        sw.style.color = redLead ? "var(--red)" : "var(--blue)";
        sw.style.background = "currentColor";
      }
    })();

    // ---- court rows ----
    document.getElementById("courts").innerHTML = MATCH.courts.map(c=>{
      const live   = c.status.toLowerCase() === "live";
      const redWin  = c.red_score  > c.blue_score;
      const blueWin = c.blue_score > c.red_score;
      const names = arr => arr.map(n=>`<span class="nm">${n}</span>`).join(`<span class="amp">/</span>`);
      return `<div class="court panel ledface">
        <div class="c-num"><span class="c-lab">COURT</span><span class="c-no">${c.court}</span></div>
        <div class="c-red side">${names(c.red)}</div>
        <div class="c-score">
          ${led(c.red_score, "red", !redWin && blueWin)}
          <span class="colon">:</span>
          ${led(c.blue_score, "blue", !blueWin && redWin)}
        </div>
        <div class="c-blue side">${names(c.blue)}</div>
        <div class="c-status ${live ? "live" : "final"}">${live ? '<span class="dot"></span>LIVE' : "FINAL"}</div>
      </div>`;
    }).join("");

    // ---- line-up columns ----
    function lineupHTML(players, team, name, captain){
      const rows = players.map(p=>{
        const cap  = /\(c\)/i.test(p);
        const base = p.replace(/\s*\(c\)\s*$/i, "").trim();
        const tag  = courtMap[base] || "BENCH";
        const on   = tag !== "BENCH";
        return `<li class="p${cap ? " cap" : ""}">
          <span class="bullet"></span>
          <span class="p-name">${base}</span>
          ${cap ? '<span class="capflag">C</span>' : ""}
          <span class="p-tag ${on ? "on" : "bench"}">${tag}</span>
        </li>`;
      }).join("");
      return `<div class="team-head">
          <span class="th-name">${name.toUpperCase()}</span>
          <span class="th-cap">CAPT · <b>${captain}</b></span>
        </div>
        <ul class="plist">${rows}</ul>`;
    }
    document.getElementById("redCol").innerHTML  = lineupHTML(MATCH.redPlayers,  "red",  MATCH.red.name,  MATCH.red.captain);
    document.getElementById("blueCol").innerHTML = lineupHTML(MATCH.bluePlayers, "blue", MATCH.blue.name, MATCH.blue.captain);
  </script>
</body>
</html>
