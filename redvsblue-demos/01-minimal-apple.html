<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TZH Friendly Match — Red vs Blue</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400&display=swap" rel="stylesheet" />
<style>
  :root{
    /* Apple-light surfaces */
    --bg:#fafafa;
    --surface:#ffffff;
    --surface-2:#f5f5f7;
    --ink:#1d1d1f;
    --ink-2:#6e6e73;
    --ink-3:#86868b;
    --line:rgba(0,0,0,0.09);
    --line-strong:rgba(0,0,0,0.14);

    --red:#ff453a;
    --blue:#0a84ff;
    --red-soft:rgba(255,69,58,0.10);
    --blue-soft:rgba(10,132,255,0.10);

    --radius:20px;
    --radius-sm:14px;
    --pad: clamp(18px, 3.2vw, 40px);
    --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 8px 30px rgba(0,0,0,0.05);

    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
            "Helvetica Neue", Helvetica, sans-serif;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html{ -webkit-text-size-adjust:100%; }

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    line-height:1.4;
    letter-spacing:-0.01em;
  }

  .wrap{
    max-width:1640px;
    margin:0 auto;
    padding: clamp(20px, 3vw, 46px) var(--pad) clamp(40px, 6vw, 80px);
  }

  /* small caps section labels */
  .eyebrow{
    font-size: clamp(0.62rem, 0.9vw, 0.78rem);
    font-weight:600;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--ink-3);
  }

  /* ---------- TOP BAR ---------- */
  .topbar{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:24px;
    flex-wrap:wrap;
    padding-bottom: clamp(16px, 2vw, 24px);
    border-bottom:1px solid var(--line);
  }
  .brand h1{
    font-size: clamp(1.35rem, 2.4vw, 2.15rem);
    font-weight:600;
    letter-spacing:-0.03em;
  }
  .brand .sub{
    margin-top:4px;
    font-size: clamp(0.85rem, 1.2vw, 1.05rem);
    color:var(--ink-2);
    font-weight:400;
  }
  .topmeta{
    display:flex;
    align-items:center;
    gap: clamp(14px, 1.6vw, 26px);
    text-align:right;
  }
  .topmeta .m .l{ font-size:0.66rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-3); }
  .topmeta .m .v{ font-size: clamp(0.85rem, 1.05vw, 1.02rem); color:var(--ink); font-weight:500; margin-top:2px; }
  .divline{ width:1px; height:34px; background:var(--line); }
  .live{
    display:inline-flex; align-items:center; gap:8px;
    font-size:0.72rem; letter-spacing:0.22em; font-weight:600; color:var(--ink);
  }
  .live-dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--red);
    box-shadow:0 0 0 0 rgba(255,69,58,0.5);
    animation:pulse 2s infinite;
  }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(255,69,58,0.45); }
    70%{ box-shadow:0 0 0 7px rgba(255,69,58,0); }
    100%{ box-shadow:0 0 0 0 rgba(255,69,58,0); }
  }

  /* ---------- HERO SCORE ---------- */
  .hero{
    display:grid;
    grid-template-columns: 1fr auto 1fr;
    align-items:center;
    gap: clamp(20px, 4vw, 70px);
    padding: clamp(30px, 5vw, 64px) 0 clamp(26px, 4vw, 52px);
    border-bottom:1px solid var(--line);
  }
  .teamblock{ display:flex; flex-direction:column; gap:6px; }
  .teamblock.red{ align-items:flex-end; text-align:right; }
  .teamblock.blue{ align-items:flex-start; text-align:left; }
  .team-name{
    display:flex; align-items:center; gap:12px;
    font-size: clamp(1.15rem, 2.3vw, 2.1rem);
    font-weight:500; letter-spacing:-0.02em;
  }
  .team-name .dot{ width: clamp(9px,1vw,13px); height:clamp(9px,1vw,13px); border-radius:50%; }
  .dot.red{ background:var(--red); }
  .dot.blue{ background:var(--blue); }
  .cap{
    font-size: clamp(0.78rem, 1vw, 0.98rem);
    color:var(--ink-2); font-weight:400;
  }
  .cap span{ color:var(--ink-3); }

  .scorewrap{ text-align:center; }
  .scorewrap .eyebrow{ margin-bottom: clamp(4px, 1vw, 12px); }
  .score{
    display:flex; align-items:baseline; justify-content:center;
    gap: clamp(14px, 2.4vw, 40px);
    font-size: clamp(4rem, 12vw, 9.5rem);
    font-weight:200;
    letter-spacing:-0.04em;
    line-height:0.9;
    font-variant-numeric: tabular-nums;
  }
  .score .s-red{ color:var(--red); }
  .score .s-blue{ color:var(--blue); }
  .score .dash{ color:var(--ink-3); font-weight:200; }
  .hero-caption{
    margin-top: clamp(6px, 1.4vw, 16px);
    font-size: clamp(0.72rem, 0.95vw, 0.92rem);
    color:var(--ink-3);
  }

  /* ---------- SECTION HEAD ---------- */
  .sec-head{
    display:flex; align-items:baseline; justify-content:space-between; gap:16px;
    margin: clamp(34px, 5vw, 60px) 0 clamp(16px, 2vw, 24px);
  }
  .sec-head h2{
    font-size: clamp(1.05rem, 1.6vw, 1.5rem);
    font-weight:600; letter-spacing:-0.02em;
  }
  .sec-head .note{ font-size: clamp(0.72rem,0.95vw,0.9rem); color:var(--ink-3); }

  /* ---------- COURTS ---------- */
  .courts{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
    gap: clamp(14px, 1.6vw, 22px);
  }
  .court{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding: clamp(18px, 1.8vw, 26px);
    box-shadow:var(--shadow);
    display:flex; flex-direction:column; gap: clamp(12px,1.4vw,18px);
  }
  .court-top{
    display:flex; align-items:center; justify-content:space-between;
    padding-bottom: clamp(10px,1.2vw,14px);
    border-bottom:1px solid var(--line);
  }
  .court-no{ font-size: clamp(0.9rem,1.1vw,1.05rem); font-weight:600; letter-spacing:-0.01em; }
  .court-no small{ display:block; font-size:0.6rem; letter-spacing:0.16em; text-transform:uppercase; color:var(--ink-3); font-weight:600; margin-bottom:2px; }
  .status{
    display:inline-flex; align-items:center; gap:7px;
    font-size:0.72rem; font-weight:600; letter-spacing:0.1em; text-transform:uppercase;
  }
  .status.final{ color:var(--ink-3); }
  .status.live{ color:var(--red); }
  .status.live .d{
    width:7px; height:7px; border-radius:50%; background:var(--red); animation:pulse 2s infinite;
  }
  .status.final .d{ width:7px; height:7px; border-radius:50%; background:var(--ink-3); }

  .side{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
  }
  .side + .side{ /* spacing handled by court gap */ }
  .side .players{ display:flex; align-items:center; gap:11px; min-width:0; }
  .side .players .dot{ width:9px; height:9px; border-radius:50%; flex:none; }
  .side .names{
    font-size: clamp(0.86rem, 1.05vw, 1.02rem);
    font-weight:450; color:var(--ink);
    white-space:normal; letter-spacing:-0.01em;
  }
  .side .names .amp{ color:var(--ink-3); font-weight:400; padding:0 2px; }
  .side .sc{
    font-size: clamp(1.7rem, 2.6vw, 2.5rem);
    font-weight:300; font-variant-numeric:tabular-nums; letter-spacing:-0.03em;
    line-height:1; flex:none;
  }
  .side.red .sc{ color:var(--red); }
  .side.blue .sc{ color:var(--blue); }
  .side.lost .names{ color:var(--ink-3); font-weight:400; }
  .side.lost .sc{ opacity:0.45; font-weight:200; }
  .side.won .names{ font-weight:600; }
  .court-mid{
    display:flex; align-items:center; gap:12px;
  }
  .court-mid .line{ flex:1; height:1px; background:var(--line); }
  .court-mid .vs{ font-size:0.62rem; letter-spacing:0.18em; color:var(--ink-3); font-weight:600; }

  /* ---------- ROSTERS ---------- */
  .rosters{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: clamp(16px, 2vw, 30px);
  }
  .roster{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding: clamp(20px, 2vw, 30px);
    box-shadow:var(--shadow);
  }
  .roster-head{
    display:flex; align-items:center; justify-content:space-between;
    padding-bottom: clamp(14px,1.6vw,18px);
    margin-bottom: clamp(14px,1.6vw,18px);
    border-bottom:1px solid var(--line);
  }
  .roster-head .t{ display:flex; align-items:center; gap:12px; }
  .roster-head .dot{ width:12px; height:12px; border-radius:50%; }
  .roster-head h3{ font-size: clamp(1rem,1.4vw,1.35rem); font-weight:600; letter-spacing:-0.02em; }
  .roster-head .count{ font-size: clamp(0.7rem,0.9vw,0.85rem); color:var(--ink-3); }

  .plist{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: clamp(2px, 0.4vw, 4px) clamp(18px, 2vw, 30px);
  }
  .prow{
    display:flex; align-items:center; gap:11px;
    padding: clamp(8px, 0.9vw, 11px) 0;
    border-bottom:1px solid var(--line);
    min-width:0;
  }
  .prow .pdot{ width:9px; height:9px; border-radius:50%; flex:none; }
  .prow.on .pdot.red{ background:var(--red); }
  .prow.on .pdot.blue{ background:var(--blue); }
  .prow.bench .pdot{ background:transparent; }
  .prow.bench .pdot.red{ border:1.5px solid var(--red); opacity:0.55; }
  .prow.bench .pdot.blue{ border:1.5px solid var(--blue); opacity:0.55; }
  .prow .pname{
    font-size: clamp(0.85rem, 1.05vw, 1rem);
    font-weight:450; letter-spacing:-0.01em; color:var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .prow.bench .pname{ color:var(--ink-2); }
  .cchip{
    font-size:0.6rem; font-weight:700; letter-spacing:0.02em;
    padding:1px 5px; border-radius:5px; flex:none;
  }
  .cchip.red{ color:var(--red); background:var(--red-soft); }
  .cchip.blue{ color:var(--blue); background:var(--blue-soft); }
  .prow .meta{
    margin-left:auto; flex:none;
    font-size: clamp(0.66rem, 0.85vw, 0.8rem);
    color:var(--ink-3); font-weight:500;
    font-variant-numeric:tabular-nums;
    letter-spacing:0.01em;
  }

  .legend{
    display:flex; gap:20px; align-items:center;
    margin-top: clamp(16px,2vw,22px);
    font-size:0.74rem; color:var(--ink-3);
  }
  .legend .li{ display:flex; align-items:center; gap:8px; }
  .legend .sw{ width:9px; height:9px; border-radius:50%; }
  .legend .sw.fill{ background:var(--ink-3); }
  .legend .sw.ring{ background:transparent; border:1.5px solid var(--ink-3); }

  footer{
    margin-top: clamp(34px,5vw,56px);
    padding-top: clamp(16px,2vw,22px);
    border-top:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;
    font-size:0.74rem; color:var(--ink-3);
  }
  footer .serif{ font-family:"Newsreader", Georgia, serif; font-weight:400; font-style:italic; font-size:0.9rem; color:var(--ink-2); letter-spacing:0; }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 900px){
    .rosters{ grid-template-columns:1fr; }
  }
  @media (max-width: 680px){
    .topbar{ align-items:flex-start; }
    .topmeta{ text-align:left; gap:14px; }
    .hero{
      grid-template-columns:1fr;
      gap: clamp(18px,5vw,26px);
      text-align:center;
    }
    .teamblock.red, .teamblock.blue{ align-items:center; text-align:center; }
    .team-name{ font-size:1.35rem; }
    .score{ font-size: clamp(4.2rem, 26vw, 6rem); }
    .courts{ grid-template-columns:1fr; }
    .plist{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>
  <div class="wrap">

    <!-- TOP BAR -->
    <header class="topbar">
      <div class="brand">
        <h1 id="title"></h1>
        <div class="sub" id="subtitle"></div>
      </div>
      <div class="topmeta">
        <div class="m"><div class="l">Date</div><div class="v" id="date"></div></div>
        <div class="divline"></div>
        <div class="m"><div class="l">Venue</div><div class="v" id="venue"></div></div>
        <div class="divline"></div>
        <div class="live"><span class="live-dot"></span>LIVE</div>
      </div>
    </header>

    <!-- HERO SCORE -->
    <section class="hero">
      <div class="teamblock red">
        <div class="team-name"><span id="red-name"></span><span class="dot red"></span></div>
        <div class="cap"><span>Captain</span> <span id="red-cap-name" style="color:var(--ink-2)"></span></div>
      </div>
      <div class="scorewrap">
        <div class="eyebrow">Games Won</div>
        <div class="score">
          <span class="s-red" id="red-games"></span>
          <span class="dash">–</span>
          <span class="s-blue" id="blue-games"></span>
        </div>
        <div class="hero-caption">Best-of match across four courts</div>
      </div>
      <div class="teamblock blue">
        <div class="team-name"><span class="dot blue"></span><span id="blue-name"></span></div>
        <div class="cap"><span>Captain</span> <span id="blue-cap-name" style="color:var(--ink-2)"></span></div>
      </div>
    </section>

    <!-- COURTS -->
    <div class="sec-head">
      <h2>Courts in play</h2>
      <div class="note" id="courts-note"></div>
    </div>
    <section class="courts" id="courts"></section>

    <!-- ROSTERS -->
    <div class="sec-head">
      <h2>Team rosters</h2>
      <div class="note">24 players · 12 per side</div>
    </div>
    <section class="rosters" id="rosters"></section>

    <div class="legend">
      <div class="li"><span class="sw fill"></span> On court</div>
      <div class="li"><span class="sw ring"></span> On the bench</div>
    </div>

    <footer>
      <div class="serif">TZH Badminton Arena</div>
      <div id="foot-right"></div>
    </footer>

  </div>

<script>
  const MATCH = {
    title: "TZH Friendly Match", subtitle: "Red vs Blue",
    date: "Monday 13 July 2026", venue: "TZH Badminton Arena",
    red:  { name: "Red Team",  games: 6, captain: "Wei Jie" },
    blue: { name: "Blue Team", games: 5, captain: "Zhang Hao" },
    redPlayers:  ["Wei Jie (C)","Marcus Tan","Kenji Wong","Arjun Rao","Daniel Lim","Ryan Ng","Samuel Goh","Ethan Chua","Lucas Teo","Nathan Sim","Oliver Yeo","Isaac Loh"],
    bluePlayers: ["Zhang Hao (C)","Aaron Koh","Bryan Ho","Vikram Nair","Julian Toh","Leon Tay","Adrian Ong","Felix Low","Gabriel See","Sean Chan","Dylan Foo","Caleb Wee"],
    courts: [
      { court: 1, red: ["Wei Jie","Marcus Tan"],   blue: ["Zhang Hao","Aaron Koh"],  red_score: 21, blue_score: 18, status: "Final" },
      { court: 2, red: ["Kenji Wong","Arjun Rao"],  blue: ["Bryan Ho","Vikram Nair"], red_score: 15, blue_score: 19, status: "Live" },
      { court: 3, red: ["Daniel Lim","Ryan Ng"],    blue: ["Julian Toh","Leon Tay"],  red_score: 11, blue_score: 9,  status: "Live" },
      { court: 4, red: ["Samuel Goh","Ethan Chua"], blue: ["Adrian Ong","Felix Low"], red_score: 8,  blue_score: 14, status: "Live" }
    ],
    redBench:  ["Lucas Teo","Nathan Sim","Oliver Yeo","Isaac Loh"],
    blueBench: ["Gabriel See","Sean Chan","Dylan Foo","Caleb Wee"]
  };

  const $ = (id) => document.getElementById(id);

  /* ---- top bar + hero ---- */
  $('title').textContent    = MATCH.title;
  $('subtitle').textContent = MATCH.red.name + "  vs  " + MATCH.blue.name;
  $('date').textContent     = MATCH.date;
  $('venue').textContent    = MATCH.venue;
  $('red-name').textContent  = MATCH.red.name;
  $('blue-name').textContent = MATCH.blue.name;
  $('red-cap-name').textContent  = MATCH.red.captain;
  $('blue-cap-name').textContent = MATCH.blue.captain;
  $('red-games').textContent  = MATCH.red.games;
  $('blue-games').textContent = MATCH.blue.games;

  const liveCount = MATCH.courts.filter(c => c.status.toLowerCase() === 'live').length;
  $('courts-note').textContent = liveCount + " live · " + (MATCH.courts.length - liveCount) + " final";

  /* ---- courts ---- */
  function pairNames(arr){
    return arr.map((n,i)=> i===0 ? n : '<span class="amp">·</span>'+n).join('');
  }

  const courtsEl = $('courts');
  MATCH.courts.forEach(c => {
    const isFinal = c.status.toLowerCase() === 'final';
    const redWon  = isFinal && c.red_score  > c.blue_score;
    const blueWon = isFinal && c.blue_score > c.red_score;
    const statusCls = isFinal ? 'final' : 'live';

    const card = document.createElement('div');
    card.className = 'court';
    card.innerHTML = `
      <div class="court-top">
        <div class="court-no"><small>Court</small>${c.court}</div>
        <div class="status ${statusCls}"><span class="d"></span>${c.status}</div>
      </div>
      <div class="side red ${redWon ? 'won' : (isFinal ? 'lost':'')}">
        <div class="players"><span class="dot red"></span><span class="names">${pairNames(c.red)}</span></div>
        <span class="sc">${c.red_score}</span>
      </div>
      <div class="court-mid"><span class="line"></span><span class="vs">VS</span><span class="line"></span></div>
      <div class="side blue ${blueWon ? 'won' : (isFinal ? 'lost':'')}">
        <div class="players"><span class="dot blue"></span><span class="names">${pairNames(c.blue)}</span></div>
        <span class="sc">${c.blue_score}</span>
      </div>
    `;
    courtsEl.appendChild(card);
  });

  /* ---- rosters ---- */
  const courtOf = {};
  MATCH.courts.forEach(c => {
    c.red.forEach(n => courtOf[n] = c.court);
    c.blue.forEach(n => courtOf[n] = c.court);
  });

  function buildRoster(teamKey, players, bench){
    const info = MATCH[teamKey];
    const wrap = document.createElement('div');
    wrap.className = 'roster';

    const benchSet = new Set(bench);

    let rows = '';
    players.forEach(raw => {
      const isCap = /\(C\)\s*$/.test(raw);
      const base  = raw.replace(/\s*\(C\)\s*$/,'').trim();
      const onCourt = courtOf[base] !== undefined;
      const stateCls = onCourt ? 'on' : (benchSet.has(base) ? 'bench' : 'on');
      const meta = onCourt ? ('Court ' + courtOf[base]) : (benchSet.has(base) ? 'Bench' : '');
      const chip = isCap ? `<span class="cchip ${teamKey}">C</span>` : '';
      rows += `
        <div class="prow ${stateCls}">
          <span class="pdot ${teamKey}"></span>
          <span class="pname">${base}</span>
          ${chip}
          <span class="meta">${meta}</span>
        </div>`;
    });

    wrap.innerHTML = `
      <div class="roster-head">
        <div class="t"><span class="dot ${teamKey}"></span><h3>${info.name}</h3></div>
        <div class="count">${players.length} players</div>
      </div>
      <div class="plist">${rows}</div>
    `;
    return wrap;
  }

  const rostersEl = $('rosters');
  rostersEl.appendChild(buildRoster('red',  MATCH.redPlayers,  MATCH.redBench));
  rostersEl.appendChild(buildRoster('blue', MATCH.bluePlayers, MATCH.blueBench));

  $('foot-right').textContent = MATCH.date + " · Games " + MATCH.red.games + "–" + MATCH.blue.games;
</script>
</body>
</html>
