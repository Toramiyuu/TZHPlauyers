<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Court Display</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#1a9e5c;--green-light:#22c66e;--dark:#0d1117;--card:#161b22;
  --border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#f0b429;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--dark);color:var(--text);min-height:100vh}

/* ── VIEWER ─────────────────────────────── */
#viewer{display:flex;flex-direction:column;min-height:100vh;padding:20px;gap:16px}
.viewer-header{text-align:center}
.viewer-header h1{font-size:clamp(18px,4vw,34px);color:var(--green-light);letter-spacing:2px;font-weight:800}
.round-badge{display:inline-block;margin-top:6px;background:var(--green);color:#fff;padding:4px 20px;border-radius:100px;font-size:clamp(13px,2vw,17px);font-weight:600;letter-spacing:1px}
#courtsDisplay{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;flex:1}
.court-card{background:var(--card);border:2px solid var(--border);border-radius:16px;padding:24px 16px;display:flex;flex-direction:column;align-items:center;gap:14px;position:relative;overflow:hidden}
.court-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--green)}
.court-label{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:3px;font-weight:600}
.team-block{width:100%;background:rgba(26,158,92,.08);border:1px solid rgba(26,158,92,.2);border-radius:12px;padding:12px 16px}
.team-players{display:flex;justify-content:center;gap:20px;align-items:flex-start;flex-wrap:wrap}
.player-slot{display:flex;flex-direction:column;align-items:center;gap:6px;max-width:110px}
.avatar{width:72px;height:72px;border-radius:50%;overflow:hidden;border:3px solid var(--green);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0;object-fit:cover}
.player-slot .pname{font-size:clamp(11px,1.4vw,14px);font-weight:600;text-align:center;word-break:break-word;line-height:1.3}
.vs-badge{font-size:clamp(16px,2.5vw,26px);font-weight:900;color:var(--accent);letter-spacing:2px}
.viewer-footer{text-align:center;color:var(--muted);font-size:13px;padding-bottom:4px}
.status-dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 7px var(--green);display:inline-block;animation:pulse 1.5s infinite;margin-right:6px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ── ADMIN ──────────────────────────────── */
#admin{display:none;max-width:960px;margin:0 auto;padding:24px;gap:20px;flex-direction:column}
.admin-header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);padding-bottom:14px}
.admin-header h1{font-size:20px;color:var(--green-light)}
.btn{padding:7px 16px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s}
.btn-primary{background:var(--green);color:#fff}.btn-primary:hover{background:var(--green-light)}
.btn-secondary{background:var(--card);color:var(--text);border:1px solid var(--border)}.btn-secondary:hover{border-color:var(--green)}
.btn-accent{background:var(--accent);color:#000}.btn-accent:hover{background:#e6a020}
.btn-danger{background:#da3633;color:#fff;font-size:12px;padding:4px 10px}.btn-danger:hover{background:#f14a44}
.btn-sm{padding:4px 11px;font-size:12px}
.section{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px}
.section h2{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* Player cards grid */
#playerCards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:12px}
.player-card{background:var(--dark);border:1px solid var(--border);border-radius:10px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative}
.player-card .delete-btn{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;background:#30363d;border:none;color:var(--muted);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center}
.player-card .delete-btn:hover{background:#da3633;color:#fff}
.photo-wrap{position:relative;cursor:pointer}
.photo-wrap:hover .photo-overlay{display:flex}
.photo-overlay{position:absolute;inset:0;background:rgba(0,0,0,.55);border-radius:50%;display:none;align-items:center;justify-content:center;font-size:18px}
.name-input{background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text);text-align:center;font-size:13px;width:100%;outline:none;padding:2px 0}
.name-input:focus{border-bottom-color:var(--green)}

/* Rounds table */
#roundList{margin-top:12px;display:flex;flex-direction:column;gap:4px}
.round-row{background:var(--dark);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.round-row-header{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;user-select:none}
.round-row-header:hover{background:rgba(255,255,255,.02)}
.round-row.live .round-row-header{border-left:3px solid var(--green)}
.round-live-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0}
.round-row.live .round-live-dot{background:var(--green);box-shadow:0 0 6px var(--green);animation:pulse 1.5s infinite}
.round-row-header .rl{font-size:13px;font-weight:600;flex:1}
.round-row-header .rsummary{font-size:12px;color:var(--muted);flex:2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.round-editor{display:none;border-top:1px solid var(--border);padding:14px 12px;background:#0d1117}
.round-row.expanded .round-editor{display:block}
.court-editor{margin-bottom:12px}
.court-editor h4{font-size:12px;color:var(--green-light);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.selectors-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.selectors-row select{background:var(--card);border:1px solid var(--border);color:var(--text);padding:5px 8px;border-radius:6px;font-size:12px;outline:none;max-width:130px}
.selectors-row select:focus{border-color:var(--green)}
.vs-small{font-size:11px;color:var(--accent);font-weight:700;padding:0 4px}
.amp{color:var(--muted);font-size:11px}

/* Link box */
.link-box{background:var(--dark);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-family:monospace;font-size:12px;color:var(--green-light);word-break:break-all;margin-top:6px}

/* Floating admin button */
#adminBtn{position:fixed;bottom:18px;right:18px;background:var(--card);border:1px solid var(--border);color:var(--muted);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:12px;transition:all .2s;z-index:100;font-family:inherit}
#adminBtn:hover{color:var(--text);border-color:var(--green)}

/* Password modal */
#pwModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:300;align-items:center;justify-content:center}
.pw-box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:30px 28px;width:320px;max-width:92vw}
.pw-box h2{font-size:17px;margin-bottom:16px;color:var(--text)}
.pw-box input{width:100%;background:var(--dark);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:8px;font-size:15px;outline:none;letter-spacing:2px}
.pw-box input:focus{border-color:var(--green)}
.pw-error{color:#f85149;font-size:12px;margin-top:6px;display:none}
.pw-actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}

/* Notification */
#notif{position:fixed;top:18px;right:18px;background:var(--green);color:#fff;padding:9px 18px;border-radius:8px;font-size:13px;font-weight:600;opacity:0;transition:opacity .3s;z-index:400}
#notif.show{opacity:1}

/* gen row */
.gen-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.gen-row label{font-size:13px;color:var(--muted)}
.gen-row input[type=number]{background:var(--dark);border:1px solid var(--border);color:var(--text);padding:5px 8px;border-radius:6px;font-size:13px;width:64px;outline:none}
.gen-row input[type=number]:focus{border-color:var(--green)}
</style>
</head>
<body>

<!-- Password modal -->
<div id="pwModal">
  <div class="pw-box">
    <h2>Admin Access</h2>
    <input id="pwInput" type="password" placeholder="Enter password" autocomplete="current-password">
    <div class="pw-error" id="pwError">Incorrect password. Try again.</div>
    <div class="pw-actions">
      <button class="btn btn-secondary" onclick="closePwModal()">Cancel</button>
      <button class="btn btn-primary" onclick="submitPassword()">Enter</button>
    </div>
  </div>
</div>

<!-- Viewer -->
<div id="viewer">
  <div class="viewer-header">
    <h1>TZHP BADMINTON</h1>
    <div class="round-badge" id="viewerRoundLabel">Round 1</div>
  </div>
  <div id="courtsDisplay"></div>
  <div class="viewer-footer"><span class="status-dot"></span>Live</div>
</div>

<!-- Admin -->
<div id="admin">
  <div class="admin-header">
    <h1>Admin Panel</h1>
    <button class="btn btn-secondary" onclick="showViewer()">View Display</button>
  </div>

  <!-- Players -->
  <div class="section">
    <h2>Players</h2>
    <div id="playerCards"></div>
    <button class="btn btn-secondary btn-sm" onclick="addPlayer()">+ Add Player</button>
  </div>

  <!-- Courts & Schedule -->
  <div class="section">
    <h2>Courts &amp; Schedule</h2>
    <div class="row">
      <label style="font-size:13px;color:var(--muted)">Number of courts:</label>
      <input id="numCourtsInput" type="number" min="1" max="8" style="background:var(--dark);border:1px solid var(--border);color:var(--text);padding:5px 8px;border-radius:6px;font-size:13px;width:60px;outline:none">
      <button class="btn btn-secondary btn-sm" onclick="saveNumCourts()">Save</button>
    </div>
    <div class="gen-row">
      <label>Auto-generate</label>
      <input id="numRoundsInput" type="number" min="1" max="50" value="10">
      <label>rounds</label>
      <button class="btn btn-primary btn-sm" onclick="generateSchedule()">Generate Schedule</button>
    </div>
    <div id="roundList"></div>
    <div style="margin-top:10px">
      <button class="btn btn-secondary btn-sm" onclick="addEmptyRound()">+ Add Round Manually</button>
    </div>
  </div>

  <!-- Share -->
  <div class="section">
    <h2>Share Viewer Link</h2>
    <p style="font-size:12px;color:var(--muted)">Send this to players — opens live court display:</p>
    <div class="link-box" id="shareLink"></div>
    <div class="row" style="margin-top:8px">
      <button class="btn btn-secondary btn-sm" onclick="copyLink()">Copy Link</button>
    </div>
  </div>
</div>

<button id="adminBtn" onclick="requestAdmin()">Admin</button>
<div id="notif"></div>

<script>
// ── STATE ────────────────────────────────────
let state = null;
let pollTimer = null;
let expandedRound = null; // index of expanded round in admin

// ── AVATAR COLORS ────────────────────────────
const COLORS = ['#1a9e5c','#2563eb','#dc2626','#7c3aed','#ea580c','#0891b2','#65a30d','#c026d3','#b45309','#0f766e'];

function getColor(id) {
  let h = 0;
  for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) & 0xffffffff;
  return COLORS[Math.abs(h) % COLORS.length];
}

function getInitials(name) {
  return (name || '?').split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2) || '?';
}

function avatarHTML(player, size = 72) {
  if (!player) return `<div class="avatar" style="width:${size}px;height:${size}px;background:#333;font-size:${size*.3}px">?</div>`;
  if (player.photo) {
    return `<img class="avatar" src="${player.photo}" style="width:${size}px;height:${size}px" alt="${player.name}">`;
  }
  return `<div class="avatar" style="width:${size}px;height:${size}px;background:${getColor(player.id)};font-size:${size*.3}px">${getInitials(player.name)}</div>`;
}

function playerById(id) {
  return (state?.players || []).find(p => p.id === id) || null;
}

// ── API ──────────────────────────────────────
function getAdminPwd() { return sessionStorage.getItem('adminPwd') || ''; }

async function apiFetch() {
  try {
    const r = await fetch('/api/state');
    return await r.json();
  } catch { return null; }
}

async function apiPost(updates) {
  const r = await fetch('/api/state', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: getAdminPwd(), ...updates })
  });
  if (r.status === 401) {
    sessionStorage.removeItem('adminPwd');
    showViewer();
    requestAdmin();
    return null;
  }
  return await r.json();
}

// ── POLLING ──────────────────────────────────
async function poll() {
  const s = await apiFetch();
  if (s) {
    state = s;
    renderViewer();
    if (document.getElementById('admin').style.display !== 'none') renderAdmin();
  }
}

function startPolling() {
  poll();
  pollTimer = setInterval(poll, 2000);
}

// ── VIEWER ───────────────────────────────────
function renderViewer() {
  if (!state) return;
  const round = state.rounds?.[state.currentRound];
  document.getElementById('viewerRoundLabel').textContent = round?.label || '';
  const container = document.getElementById('courtsDisplay');
  container.innerHTML = '';
  (round?.courts || []).forEach((court, i) => {
    container.appendChild(buildCourtCard(i + 1, court));
  });
}

function buildCourtCard(num, court) {
  const el = document.createElement('div');
  el.className = 'court-card';
  const t1p1 = playerById(court.team1[0]);
  const t1p2 = playerById(court.team1[1]);
  const t2p1 = playerById(court.team2[0]);
  const t2p2 = playerById(court.team2[1]);

  function slot(p) {
    return `<div class="player-slot">${avatarHTML(p, 72)}<span class="pname">${p?.name || '—'}</span></div>`;
  }

  el.innerHTML = `
    <div class="court-label">Court ${num}</div>
    <div class="team-block"><div class="team-players">${slot(t1p1)}${slot(t1p2)}</div></div>
    <div class="vs-badge">VS</div>
    <div class="team-block"><div class="team-players">${slot(t2p1)}${slot(t2p2)}</div></div>
  `;
  return el;
}

// ── ADMIN ────────────────────────────────────
function renderAdmin() {
  if (!state) return;
  renderPlayerCards();
  document.getElementById('numCourtsInput').value = state.numCourts || 1;
  renderRoundList();
  document.getElementById('shareLink').textContent = window.location.origin + '/';
}

// ── PLAYER CARDS ─────────────────────────────
function renderPlayerCards() {
  const grid = document.getElementById('playerCards');
  grid.innerHTML = '';
  (state.players || []).forEach(p => {
    const card = document.createElement('div');
    card.className = 'player-card';
    card.innerHTML = `
      <button class="delete-btn" onclick="removePlayer('${p.id}')" title="Remove player">×</button>
      <div class="photo-wrap" onclick="triggerPhotoUpload('${p.id}')">
        ${avatarHTML(p, 64)}
        <div class="photo-overlay">📷</div>
      </div>
      <input class="name-input" type="text" value="${escHtml(p.name)}"
        onchange="updatePlayerName('${p.id}', this.value)"
        onblur="updatePlayerName('${p.id}', this.value)"
        placeholder="Player name">
      <input type="file" id="photo_${p.id}" accept="image/*" style="display:none"
        onchange="handlePhotoUpload('${p.id}', this)">
    `;
    grid.appendChild(card);
  });
}

function triggerPhotoUpload(id) {
  document.getElementById('photo_' + id)?.click();
}

async function handlePhotoUpload(id, input) {
  const file = input.files[0];
  if (!file) return;
  const photo = await compressPhoto(file);
  const players = state.players.map(p => p.id === id ? { ...p, photo } : p);
  await apiPost({ players });
  state.players = players;
  renderPlayerCards();
  notify('Photo updated!');
}

async function updatePlayerName(id, name) {
  if (!name.trim()) return;
  const players = state.players.map(p => p.id === id ? { ...p, name: name.trim() } : p);
  await apiPost({ players });
  state.players = players;
  renderRoundList(); // names in summary update
}

async function addPlayer() {
  const id = 'p' + Date.now();
  const num = (state.players?.length || 0) + 1;
  const players = [...(state.players || []), { id, name: `Player ${num}`, photo: null }];
  await apiPost({ players });
  state.players = players;
  renderPlayerCards();
  notify('Player added!');
}

async function removePlayer(id) {
  const players = (state.players || []).filter(p => p.id !== id);
  await apiPost({ players });
  state.players = players;
  renderPlayerCards();
  renderRoundList();
  notify('Player removed.');
}

// ── COURTS & ROUNDS ──────────────────────────
async function saveNumCourts() {
  const n = parseInt(document.getElementById('numCourtsInput').value) || 1;
  const numCourts = Math.max(1, Math.min(8, n));
  await apiPost({ numCourts });
  state.numCourts = numCourts;
  notify(`Courts set to ${numCourts}`);
}

async function generateSchedule() {
  const numRounds = parseInt(document.getElementById('numRoundsInput').value) || 10;
  const players = state.players || [];
  const numCourts = state.numCourts || 1;
  const perRound = numCourts * 4;

  if (players.length < 4) {
    return notify('Need at least 4 players to generate a schedule.');
  }
  if (players.length < perRound) {
    return notify(`Need at least ${perRound} players for ${numCourts} court(s). Add more players or reduce courts.`);
  }

  const rounds = smartSchedule(players, numCourts, numRounds);
  const currentRound = 0;
  await apiPost({ rounds, currentRound });
  state.rounds = rounds;
  state.currentRound = 0;
  expandedRound = null;
  renderRoundList();
  notify('Schedule generated!');
}

async function addEmptyRound() {
  const rounds = [...(state.rounds || [])];
  const n = rounds.length + 1;
  const courts = [];
  const numCourts = state.numCourts || 1;
  const pids = (state.players || []).map(p => p.id);
  for (let c = 0; c < numCourts; c++) {
    courts.push({
      team1: [pids[0] || '', pids[1] || ''],
      team2: [pids[2] || '', pids[3] || '']
    });
  }
  rounds.push({ label: `Round ${n}`, courts });
  await apiPost({ rounds });
  state.rounds = rounds;
  expandedRound = rounds.length - 1;
  renderRoundList();
}

async function setCurrentRound(i) {
  await apiPost({ currentRound: i });
  state.currentRound = i;
  renderRoundList();
  notify('Round set live!');
}

async function deleteRound(i) {
  const rounds = state.rounds.filter((_, j) => j !== i);
  const currentRound = Math.min(state.currentRound, Math.max(0, rounds.length - 1));
  await apiPost({ rounds, currentRound });
  state.rounds = rounds;
  state.currentRound = currentRound;
  if (expandedRound === i) expandedRound = null;
  else if (expandedRound > i) expandedRound--;
  renderRoundList();
}

async function saveRound(i) {
  // Collect edited data from the round editor
  const rounds = JSON.parse(JSON.stringify(state.rounds));
  const r = rounds[i];
  const labelInput = document.getElementById(`rl_label_${i}`);
  if (labelInput) r.label = labelInput.value.trim() || r.label;

  const numCourts = r.courts.length;
  for (let c = 0; c < numCourts; c++) {
    const get = (role) => document.getElementById(`rl_${i}_c${c}_${role}`)?.value || '';
    r.courts[c] = {
      team1: [get('t1p1'), get('t1p2')],
      team2: [get('t2p1'), get('t2p2')]
    };
  }

  await apiPost({ rounds });
  state.rounds = rounds;
  renderRoundList();
  notify('Round saved!');
}

function roundSummary(round) {
  return (round.courts || []).map((c, i) => {
    const n = (id) => playerById(id)?.name?.split(' ')[0] || '?';
    return `C${i+1}: ${n(c.team1[0])}&${n(c.team1[1])} vs ${n(c.team2[0])}&${n(c.team2[1])}`;
  }).join(' | ');
}

function buildPlayerSelect(elId, selectedId) {
  const opts = (state.players || []).map(p =>
    `<option value="${p.id}"${p.id === selectedId ? ' selected' : ''}>${escHtml(p.name)}</option>`
  ).join('');
  return `<select id="${elId}">${opts}</select>`;
}

function renderRoundList() {
  const list = document.getElementById('roundList');
  list.innerHTML = '';
  (state.rounds || []).forEach((round, i) => {
    const isLive = i === state.currentRound;
    const isExpanded = i === expandedRound;
    const div = document.createElement('div');
    div.className = 'round-row' + (isLive ? ' live' : '') + (isExpanded ? ' expanded' : '');

    // Build court editors
    let courtEditorsHTML = '';
    (round.courts || []).forEach((court, c) => {
      courtEditorsHTML += `
        <div class="court-editor">
          <h4>Court ${c + 1}</h4>
          <div class="selectors-row">
            <span style="font-size:12px;color:var(--muted)">Team A:</span>
            ${buildPlayerSelect(`rl_${i}_c${c}_t1p1`, court.team1[0])}
            <span class="amp">&amp;</span>
            ${buildPlayerSelect(`rl_${i}_c${c}_t1p2`, court.team1[1])}
            <span class="vs-small">VS</span>
            <span style="font-size:12px;color:var(--muted)">Team B:</span>
            ${buildPlayerSelect(`rl_${i}_c${c}_t2p1`, court.team2[0])}
            <span class="amp">&amp;</span>
            ${buildPlayerSelect(`rl_${i}_c${c}_t2p2`, court.team2[1])}
          </div>
        </div>
      `;
    });

    div.innerHTML = `
      <div class="round-row-header" onclick="toggleRoundExpand(${i})">
        <div class="round-live-dot"></div>
        <span class="rl">${escHtml(round.label)}</span>
        <span class="rsummary">${roundSummary(round)}</span>
        <button class="btn btn-accent btn-sm" style="margin-left:6px;white-space:nowrap" onclick="event.stopPropagation();setCurrentRound(${i})">${isLive ? '● Live' : 'Set Live'}</button>
        <button class="btn btn-danger btn-sm" onclick="event.stopPropagation();deleteRound(${i})">✕</button>
      </div>
      <div class="round-editor">
        <div class="row" style="margin-bottom:12px">
          <label style="font-size:13px;color:var(--muted)">Label:</label>
          <input id="rl_label_${i}" type="text" value="${escHtml(round.label)}" style="background:var(--card);border:1px solid var(--border);color:var(--text);padding:5px 10px;border-radius:6px;font-size:13px;outline:none;flex:1">
        </div>
        ${courtEditorsHTML}
        <button class="btn btn-primary btn-sm" onclick="saveRound(${i})">Save Round</button>
      </div>
    `;
    list.appendChild(div);
  });
}

function toggleRoundExpand(i) {
  expandedRound = expandedRound === i ? null : i;
  renderRoundList();
}

// ── SMART SCHEDULE ALGORITHM ──────────────────
function smartSchedule(players, numCourts, numRounds) {
  const n = players.length;
  const perRound = Math.min(numCourts * 4, Math.floor(n / 4) * 4);
  const activeCourts = perRound / 4;

  // Rest tracking
  const lastPlayed = new Array(n).fill(-999);
  const playCount = new Array(n).fill(0);
  const partnerCount = Array.from({ length: n }, () => new Array(n).fill(0));

  const rounds = [];

  for (let r = 0; r < numRounds; r++) {
    // Rank by: most rest → fewest plays → index
    const ranking = Array.from({ length: n }, (_, i) => i).sort((a, b) => {
      const ra = r - lastPlayed[a];
      const rb = r - lastPlayed[b];
      if (rb !== ra) return rb - ra;
      if (playCount[a] !== playCount[b]) return playCount[a] - playCount[b];
      return a - b;
    });

    const selected = ranking.slice(0, perRound);

    // Greedy pairing: minimize repeated partnerships
    const avail = [...selected];
    const pairs = [];
    while (avail.length >= 2) {
      const p1 = avail.shift();
      let best = avail[0], bestScore = Infinity;
      for (const p2 of avail) {
        const s = partnerCount[p1][p2];
        if (s < bestScore) { bestScore = s; best = p2; }
      }
      avail.splice(avail.indexOf(best), 1);
      pairs.push([p1, best]);
    }

    // Assign pairs to courts
    const courts = [];
    for (let c = 0; c < activeCourts; c++) {
      const [a, b] = pairs[c * 2];
      const [d, e] = pairs[c * 2 + 1];
      courts.push({
        team1: [players[a].id, players[b].id],
        team2: [players[d].id, players[e].id],
      });
      partnerCount[a][b]++; partnerCount[b][a]++;
      partnerCount[d][e]++; partnerCount[e][d]++;
    }

    selected.forEach(i => { lastPlayed[i] = r; playCount[i]++; });
    rounds.push({ label: `Round ${r + 1}`, courts });
  }

  return rounds;
}

// ── PHOTO COMPRESSION ────────────────────────
function compressPhoto(file) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const size = 150;
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        const sq = Math.min(img.width, img.height);
        const sx = (img.width - sq) / 2;
        const sy = (img.height - sq) / 2;
        ctx.drawImage(img, sx, sy, sq, sq, 0, 0, size, size);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// ── ADMIN AUTH ───────────────────────────────
function requestAdmin() {
  if (sessionStorage.getItem('adminPwd')) {
    showAdmin();
  } else {
    openPwModal();
  }
}

function openPwModal() {
  document.getElementById('pwModal').style.display = 'flex';
  document.getElementById('pwInput').value = '';
  document.getElementById('pwError').style.display = 'none';
  setTimeout(() => document.getElementById('pwInput').focus(), 50);
}

function closePwModal() {
  document.getElementById('pwModal').style.display = 'none';
}

function submitPassword() {
  const pwd = document.getElementById('pwInput').value;
  // Quick client-side check — server also validates every POST
  if (pwd === 'TZH123' || pwd) {
    // Try a test POST to verify server-side
    fetch('/api/state', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pwd })
    }).then(r => {
      if (r.ok) {
        sessionStorage.setItem('adminPwd', pwd);
        closePwModal();
        showAdmin();
      } else {
        document.getElementById('pwError').style.display = 'block';
      }
    }).catch(() => {
      document.getElementById('pwError').style.display = 'block';
    });
  } else {
    document.getElementById('pwError').style.display = 'block';
  }
}

document.getElementById('pwInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') submitPassword();
});

// ── NAVIGATION ───────────────────────────────
function showAdmin() {
  document.getElementById('viewer').style.display = 'none';
  document.getElementById('admin').style.display = 'flex';
  document.getElementById('adminBtn').style.display = 'none';
  if (state) renderAdmin();
}

function showViewer() {
  document.getElementById('viewer').style.display = 'flex';
  document.getElementById('admin').style.display = 'none';
  document.getElementById('adminBtn').style.display = 'block';
}

// ── UTILITIES ────────────────────────────────
function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function notify(msg) {
  const el = document.getElementById('notif');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}

function copyLink() {
  navigator.clipboard.writeText(window.location.origin + '/').then(() => notify('Link copied!'));
}

// ── INIT ─────────────────────────────────────
if (window.location.search.includes('admin') || window.location.hash === '#admin') {
  if (sessionStorage.getItem('adminPwd')) showAdmin();
  else openPwModal();
}

startPolling();
</script>
