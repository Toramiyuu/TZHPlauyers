<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TZH Badminton — Arena</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
  :root{
    --blue:#0071e3; --blue-2:#0066cc; --blue-dark:#005bb5;
    --blue-tint:rgba(0,113,227,.16); --blue-line:rgba(0,113,227,.42);
    --bg:#eef4fd; --bg-2:#e8f0fb; --card:#ffffff; --card-2:#e2ecfa;
    --ink:#1d1d1f; --ink-2:#5c6470; --ink-3:#5f6b7a; --line:#d4e2f5;
    /* "Ending Soon" amber — AA-legible over the amber tint, mirrors the 2D viewer */
    --amber:#9a4d00; --amber-tint:rgba(255,149,0,.18); --amber-line:rgba(255,149,0,.5);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 700px at 70% -10%, #ffffff 0%, rgba(255,255,255,0) 60%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  /* ---------- WebGL canvas backdrop ---------- */
  #scene{
    position:fixed; inset:0; width:100%; height:100%;
    display:block; z-index:0;
  }
  /* CSS fallback backdrop (visible if WebGL fails or behind transparent canvas) */
  #backdrop{
    position:fixed; inset:0; z-index:-1;
    background:
      radial-gradient(900px 520px at 28% 18%, rgba(0,113,227,.10), rgba(0,113,227,0) 60%),
      radial-gradient(1000px 600px at 80% 88%, rgba(0,102,204,.10), rgba(0,102,204,0) 62%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
  }

  /* ---------- HUD overlay ---------- */
  #hud{
    position:fixed; inset:0; z-index:10;
    display:flex; flex-direction:column;
    padding:26px clamp(24px,3.4vw,56px) 22px;
    pointer-events:none; /* let drags pass to scene; panels re-enable */
  }
  .hud-panel{ pointer-events:auto; }

  /* glass surface */
  .glass{
    background:linear-gradient(180deg, rgba(255,255,255,.82), rgba(255,255,255,.66));
    border:1px solid rgba(255,255,255,.85);
    box-shadow:
      0 1px 0 rgba(255,255,255,.9) inset,
      0 18px 50px -22px rgba(20,52,99,.45),
      0 2px 10px -4px rgba(20,52,99,.22);
    -webkit-backdrop-filter:saturate(1.5) blur(18px);
    backdrop-filter:saturate(1.5) blur(18px);
  }

  /* ===== Header ===== */
  header{
    display:flex; align-items:center; gap:18px;
    padding:12px 18px; border-radius:18px;
  }
  header img{ height:46px; width:auto; display:block; }
  .brand{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .brand h1{
    font-size:19px; font-weight:650; letter-spacing:-.02em; color:var(--ink);
    line-height:1;
  }
  .brand .date{ font-size:12.5px; color:var(--ink-2); font-weight:480; letter-spacing:.01em; }
  .header-spacer{ flex:1 1 auto; }

  .live{
    display:inline-flex; align-items:center; gap:8px;
    padding:7px 13px 7px 11px; border-radius:999px;
    background:var(--blue-tint); border:1px solid var(--blue-line);
    font-size:12px; font-weight:600; color:var(--blue-dark); letter-spacing:.04em;
    text-transform:uppercase;
  }
  .live .dot{
    width:9px; height:9px; border-radius:50%;
    background:var(--blue);
    box-shadow:0 0 0 0 rgba(0,113,227,.55);
    animation:pulse 1.8s ease-out infinite;
  }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(0,113,227,.55); }
    70%{ box-shadow:0 0 0 9px rgba(0,113,227,0); }
    100%{ box-shadow:0 0 0 0 rgba(0,113,227,0); }
  }
  .nav{ display:flex; gap:9px; }
  .pill{
    display:inline-flex; align-items:center; gap:6px;
    padding:8px 16px; border-radius:999px;
    font-size:13px; font-weight:550; color:var(--ink-2);
    background:rgba(255,255,255,.6);
    border:1px solid var(--line);
    transition:.18s ease;
    cursor:pointer; font-family:inherit; line-height:1;
  }
  .pill svg{ width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:0 0 auto; }
  .pill:hover{ color:var(--blue-dark); border-color:var(--blue-line); background:var(--blue-tint); }
  .pill:active{ transform:translateY(1px); }
  .pill.admin{ color:var(--blue-dark); border-color:var(--blue-line); background:var(--blue-tint); }
  .pill.admin:hover{ color:#fff; background:linear-gradient(180deg,var(--blue),var(--blue-2)); border-color:transparent; box-shadow:0 6px 16px -6px rgba(0,113,227,.6); }

  /* ===== Exit-3D button (returns to the normal 2D viewer) ===== */
  .exit3d{
    pointer-events:auto;
    display:inline-flex; align-items:center; gap:6px;
    padding:8px 14px 8px 11px; border-radius:999px;
    font-size:13px; font-weight:600; color:var(--blue-dark); letter-spacing:.01em;
    background:rgba(255,255,255,.7); border:1px solid var(--blue-line);
    cursor:pointer; transition:.18s ease; font-family:inherit;
  }
  .exit3d svg{ width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
  .exit3d:hover{ background:var(--blue-tint); border-color:var(--blue); color:var(--blue); }
  .exit3d:active{ transform:translateY(1px); }
  @media (max-width:620px){ .exit3d span{ display:none; } .exit3d{ padding:8px; } }

  /* ===== Center stage spacer ===== */
  .stage{ flex:1 1 auto; min-height:0; }

  /* ===== Match cards (bottom strip) ===== */
  .cards{
    pointer-events:none;
    display:grid; grid-template-columns:repeat(4,1fr);
    gap:16px;
  }
  .card{
    pointer-events:auto;
    border-radius:18px; padding:15px 16px 14px;
    display:flex; flex-direction:column; gap:12px;
    position:relative; overflow:hidden;
  }
  .card::before{ /* top accent hairline */
    content:""; position:absolute; left:16px; right:16px; top:0; height:2px;
    background:linear-gradient(90deg, transparent, var(--blue-line), transparent);
  }
  .card-top{ display:flex; align-items:center; justify-content:center; gap:8px; }
  .court-id{ display:flex; align-items:center; gap:8px; }
  .court-num{
    font-size:13px; font-weight:680; letter-spacing:-.01em; color:var(--ink);
  }
  .court-num span{ color:var(--ink-3); font-weight:520; }
  .round-badge{
    font-size:10.5px; font-weight:650; letter-spacing:.05em; text-transform:uppercase;
    color:var(--blue-dark);
    padding:4px 9px; border-radius:999px;
    background:var(--blue-tint); border:1px solid var(--blue-line);
  }
  /* "Ending Soon" pill — mirrors the 2D viewer's per-court amber badge */
  .ending-badge{
    display:inline-flex; align-items:center; gap:6px;
    font-size:10.5px; font-weight:650; letter-spacing:.05em; text-transform:uppercase;
    color:var(--amber);
    padding:4px 9px 4px 8px; border-radius:999px;
    background:var(--amber-tint); border:1px solid var(--amber-line);
  }
  .ending-badge .es-dot{
    width:6px; height:6px; border-radius:50%; background:var(--amber);
    flex:0 0 auto; animation:esblink 1.8s infinite;
  }
  @keyframes esblink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
  @media (prefers-reduced-motion:reduce){ .ending-badge .es-dot{ animation:none; } }
  /* amber top-hairline accent on a court that's wrapping up */
  .card.ending::before{ background:linear-gradient(90deg, transparent, var(--amber-line), transparent); }

  .team{ display:flex; align-items:center; justify-content:center; gap:10px; }
  .avatars{ display:flex; }
  .avatars .av:nth-child(2){ margin-left:-9px; }
  .av{
    width:32px; height:32px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:670; letter-spacing:.01em; color:#fff;
    background:linear-gradient(155deg, var(--blue) 0%, var(--blue-dark) 100%);
    border:2px solid #fff;
    box-shadow:0 3px 8px -3px rgba(0,113,227,.55);
    flex:0 0 auto;
  }
  .av.alt{ background:linear-gradient(155deg, #4a9bf0 0%, var(--blue-2) 100%); }
  .av.has-photo{ overflow:hidden; background:#dce7f7; }
  .av.has-photo img{ width:100%; height:100%; object-fit:cover; display:block; }
  .names{ display:flex; flex-direction:column; gap:1px; min-width:0; line-height:1.18; text-align:center; }
  .names .n{ font-size:12.5px; font-weight:560; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .vs-row{ display:flex; align-items:center; gap:10px; }
  .vs-line{ flex:1; height:1px; background:linear-gradient(90deg,transparent,var(--line),transparent); }
  .vs{
    font-size:10.5px; font-weight:700; letter-spacing:.12em; color:var(--blue);
    text-transform:uppercase;
  }

  /* ===== Footer ===== */
  footer{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:16px;
    font-size:12px; color:var(--ink-2); letter-spacing:.01em;
    padding:0 4px;
  }
  footer .right{ color:var(--ink-3); font-weight:520; }
  footer strong{ color:var(--ink); font-weight:600; }

  /* ===== Up Next (mirrors the 2D viewer's Up Next card) ===== */
  #upNext{
    pointer-events:auto;
    margin-top:14px;
    border-radius:18px;
    padding:14px 20px 12px;
  }
  .un-head{
    font-size:11px; font-weight:650; letter-spacing:.07em; text-transform:uppercase;
    color:var(--ink-3); margin-bottom:8px;
  }
  .un-row{
    display:flex; align-items:center; gap:14px;
    padding:9px 0; border-top:1px solid var(--line);
    font-size:14px;
  }
  .un-row:first-of-type{ border-top:none; }
  .un-court{ flex:0 0 auto; font-weight:640; color:var(--ink-2); min-width:78px; }
  .un-arrow{ flex:0 0 auto; color:var(--blue); font-weight:700; }
  .un-match{ flex:1; min-width:0; font-weight:540; color:var(--ink); letter-spacing:-.01em; }

  @media (max-width:1080px){
    .cards{ grid-template-columns:repeat(2,1fr); }
  }
  @media (max-width:620px){
    .cards{ grid-template-columns:1fr; }
    .nav{ display:none; }
    #upNext{ padding:12px 15px 10px; }
    .un-row{ font-size:13px; gap:10px; }
    .un-court{ min-width:64px; }
  }
</style>
</head>
<body>
  <div id="backdrop"></div>
  <canvas id="scene"></canvas>

  <div id="hud">
    <!-- Header -->
    <header class="hud-panel glass">
      <button id="exit3d" class="exit3d" type="button" title="Back to the normal (2D) view">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        <span>Normal view</span>
      </button>
      <img src="logo.png" alt="TZH" onerror="this.style.display='none'" />
      <div class="brand">
        <h1>TZH Badminton</h1>
        <div class="date" id="arenaDate"></div>
      </div>
      <div class="header-spacer"></div>
      <div class="live"><span class="dot"></span>Live</div>
      <nav class="nav">
        <button id="navMembers" class="pill" type="button" title="Open the members list">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10v3a5 5 0 0 1-10 0z"/><path d="M7 6H4.5a2.5 2.5 0 0 0 3 2.4M17 6h2.5a2.5 2.5 0 0 1-3 2.4M10 12.5h4M12 12.5V16M9 20h6M10 20l.5-4M14 20l-.5-4"/></svg>Members
        </button>
        <button id="navLeaderboard" class="pill" type="button" title="Open the leaderboard">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="5"/><path d="M8.5 12 7 21l5-2.8 5 2.8-1.5-9"/></svg>Leaderboard
        </button>
        <button id="navJoin" class="pill" type="button" title="Sign up for social games">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Join social games
        </button>
        <button id="navAdmin" class="pill admin" type="button" title="Open the admin panel">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 2h-4l-.5 2.4a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12a7 7 0 0 0 .1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 22h4l.5-2.4a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6A7 7 0 0 0 19 12z"/></svg>Admin
        </button>
      </nav>
    </header>

    <div class="stage"></div>

    <!-- Match cards -->
    <div class="cards" id="cards"></div>

    <!-- Up Next (mirrors the 2D viewer) — one row per court that has a next round -->
    <div id="upNext" class="hud-panel glass" style="display:none"></div>

    <!-- Footer -->
    <footer class="hud-panel">
      <div class="left">TZH Badminton — Live Court Display</div>
      <div class="right" id="arenaStats"><strong>—</strong></div>
    </footer>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =========================================================
   CONTENT MODEL — driven by the LIVE court state (/api/state)
   ---------------------------------------------------------
   This page is the "3D mode" of the main viewer. The pure helpers below map the
   server state into the arena's MATCHES model (one entry per active court). They
   mirror index.html's playerById/getCourtRounds so the 2D and 3D views always
   show the same matches. Unit-tested in scripts/test-arena-data.js.
   ========================================================= */
function initials(name){
  return String(name||'?').trim().split(/\s+/).map(function(w){return w[0]||'';}).join('').slice(0,2).toUpperCase() || '?';
}

// id → { id, name, photo }; prefer the roster's name/photo (always current),
// fall back to the players entry. Mirrors index.html playerById(). Returns null
// for ids present in neither collection.
function resolvePlayer(state, id){
  var players = (state && state.players) || [];
  var roster  = (state && state.roster)  || [];
  var fromPlayers = null, fromRoster = null;
  for (var i=0;i<players.length;i++){ if (players[i] && players[i].id === id){ fromPlayers = players[i]; break; } }
  for (var j=0;j<roster.length;j++){ if (roster[j] && roster[j].id === id){ fromRoster = roster[j]; break; } }
  if (!fromPlayers && !fromRoster) return null;
  if (!fromPlayers) return { id:id, name:fromRoster.name, photo:fromRoster.photo || null };
  if (!fromRoster)  return { id:id, name:fromPlayers.name, photo:fromPlayers.photo || null };
  return { id:id, name:fromRoster.name, photo:(fromRoster.photo || fromPlayers.photo || null) };
}

// Per-court round index: the explicit courtRounds array when long enough, else
// numCourts copies of currentRound.
function getArenaCourtRounds(state){
  var numCourts = (state && state.numCourts) || 1;
  var base = (state && state.currentRound) || 0;
  var cr = state && state.courtRounds;
  if (Array.isArray(cr) && cr.length >= numCourts) return cr.slice(0, numCourts);
  var out = []; for (var i=0;i<numCourts;i++) out.push(base); return out;
}

// state → [{ court, round, roundLabel, t1:[names], t2:[names], photos1, photos2 }]
// One entry per court that has a court slot in its current round. Unknown/empty
// player ids are dropped from a team rather than rendered as ghosts.
function buildMatchesFromState(state){
  if (!state) return [];
  var numCourts = state.numCourts || 1;
  var courtRounds = getArenaCourtRounds(state);
  var rounds = state.rounds || [];
  var out = [];
  for (var i=0;i<numCourts;i++){
    var ri = (courtRounds[i] != null) ? courtRounds[i] : 0;
    var round = rounds[ri];
    var court = (round && round.courts) ? round.courts[i] : null;
    if (!court) continue;
    var resolved = function(ids){
      return (ids || []).map(function(id){ return resolvePlayer(state, id); }).filter(Boolean);
    };
    var r1 = resolved(court.team1), r2 = resolved(court.team2);
    out.push({
      court: i + 1,
      round: ri + 1,
      roundLabel: (round && round.label) || ('Round ' + (ri + 1)),
      endingSoon: !!(state.endingSoon && state.endingSoon[i]),
      t1: r1.map(function(p){ return p.name; }),
      t2: r2.map(function(p){ return p.name; }),
      photos1: r1.map(function(p){ return p.photo || null; }),
      photos2: r2.map(function(p){ return p.photo || null; })
    });
  }
  return out;
}

// state → [{ court, text }] — the upcoming matchup for each court that HAS a next
// round (its current index + 1 < total). Courts on their last round, or without a
// court slot in the next round, are omitted. Mirrors index.html's computeNextUp()
// and its row text so the 2D and 3D "Up Next" always agree; unknown/empty ids
// resolve to 'TBD'. Unit-tested in scripts/test-arena-data.js.
function buildNextUpFromState(state){
  if (!state) return [];
  var numCourts = state.numCourts || 1;
  var courtRounds = getArenaCourtRounds(state);
  var rounds = state.rounds || [];
  var total = rounds.length;
  var out = [];
  for (var i=0;i<numCourts;i++){
    var ni = ((courtRounds[i] != null) ? courtRounds[i] : 0) + 1;
    if (ni >= total) continue;
    var court = (rounds[ni] && rounds[ni].courts) ? rounds[ni].courts[i] : null;
    if (!court) continue;
    var nameOf = function(id){ var p = resolvePlayer(state, id); return p ? p.name : 'TBD'; };
    var t1 = court.team1 || [], t2 = court.team2 || [];
    out.push({
      court: i + 1,
      text: nameOf(t1[0]) + ' & ' + nameOf(t1[1]) + ' vs ' + nameOf(t2[0]) + ' & ' + nameOf(t2[1])
    });
  }
  return out;
}

// The arena's working set, refreshed from the server every few seconds.
var MATCHES = [];
var PLAYER_PHOTOS = {};   // name → photo data-URL, fed into the 3D avatar tokens

function teamHTML(players, alt){
  var avs = players.map(function(p,i){
    var photo = PLAYER_PHOTOS[p];
    var inner = photo
      ? '<img src="'+photo+'" alt="">'
      : initials(p);
    return '<div class="av'+((alt|| i===1)?' alt':'')+(photo?' has-photo':'')+'">'+inner+'</div>';
  }).join('');
  var nms = players.map(function(p){ return '<div class="n">'+escapeHtml(p)+'</div>'; }).join('');
  return '<div class="team"><div class="avatars">'+avs+'</div><div class="names">'+nms+'</div></div>';
}
function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}

// ── DOM: bottom match-card strip ──────────────────────────────────────────
function renderCards(matches){
  var el = document.getElementById('cards');
  if (!el) return;
  if (!matches.length){
    el.innerHTML = '<div class="card glass" style="grid-column:1/-1;text-align:center;color:var(--ink-2)">No live matches yet — set up a round in the admin panel.</div>';
    return;
  }
  el.innerHTML = matches.map(function(m){
    return ''+
    '<div class="card glass'+(m.endingSoon ? ' ending' : '')+'">'+
      '<div class="card-top">'+
        '<div class="court-id"><span class="court-num">Court '+m.court+' <span>·</span></span>'+
          '<span class="round-badge">'+escapeHtml(m.roundLabel)+'</span>'+
          (m.endingSoon ? '<span class="ending-badge"><span class="es-dot"></span>Ending Soon</span>' : '')+
        '</div>'+
      '</div>'+
      teamHTML(m.t1, false)+
      '<div class="vs-row"><span class="vs-line"></span><span class="vs">vs</span><span class="vs-line"></span></div>'+
      teamHTML(m.t2, true)+
    '</div>';
  }).join('');
}

// ── DOM: "Up Next" panel (mirrors the 2D viewer) ──────────────────────────
// One row per court that has a next round. Hidden when the admin's "Up Next"
// toggle is off (state.showNextUp === false) or no court has a next round.
function renderNextUp(state){
  var el = document.getElementById('upNext');
  if (!el) return;
  var rows = (state && state.showNextUp === false) ? [] : buildNextUpFromState(state);
  if (!rows.length){ el.style.display = 'none'; el.innerHTML = ''; return; }
  el.style.display = '';
  el.innerHTML = '<div class="un-head">Up Next</div>' + rows.map(function(r){
    return '<div class="un-row">'+
      '<span class="un-court">Court '+r.court+'</span>'+
      '<span class="un-arrow" aria-hidden="true">→</span>'+
      '<span class="un-match">'+escapeHtml(r.text)+'</span>'+
    '</div>';
  }).join('');
}

// ── DOM: header date + footer stats ───────────────────────────────────────
function formatArenaDate(iso){
  if (!iso) return '';
  var parts = String(iso).split('-');
  if (parts.length !== 3) return '';
  var d = new Date(Date.UTC(+parts[0], +parts[1]-1, +parts[2]));
  if (isNaN(d.getTime())) return '';
  return d.toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric', timeZone:'UTC' });
}
function updateHud(state, matches){
  var dateEl = document.getElementById('arenaDate');
  if (dateEl) dateEl.textContent = formatArenaDate(state && state.sessionDate) || '';
  var statsEl = document.getElementById('arenaStats');
  if (statsEl){
    var ids = {};
    matches.forEach(function(m){
      m.t1.concat(m.t2).forEach(function(n){ if (n) ids[n] = 1; });
    });
    var nc = matches.length;
    var np = Object.keys(ids).length;
    statsEl.innerHTML = '<strong>'+nc+' court'+(nc===1?'':'s')+'</strong> · '+np+' player'+(np===1?'':'s');
  }
}

// name → photo map for the 3D avatar tokens
function buildPhotoMap(matches){
  var map = {};
  matches.forEach(function(m){
    m.t1.forEach(function(n,i){ if (m.photos1[i]) map[n] = m.photos1[i]; });
    m.t2.forEach(function(n,i){ if (m.photos2[i]) map[n] = m.photos2[i]; });
  });
  return map;
}

// ── DATA: fetch the live state (same gate code as the main app) ───────────
function getArenaCode(){
  try {
    var qs = new URLSearchParams(location.search);
    var fromUrl = qs.get('code');
    if (fromUrl) return fromUrl;
  } catch(e){}
  try { return localStorage.getItem('siteCode') || ''; } catch(e){ return ''; }
}
function isEmbedded(){
  try {
    if (window.parent && window.parent !== window) return true;
    var qs = new URLSearchParams(location.search);
    return qs.get('embed') === '1';
  } catch(e){ return false; }
}
async function fetchArenaState(){
  try {
    var code = getArenaCode();
    var url = code ? '/api/state?code=' + encodeURIComponent(code) : '/api/state';
    var r = await fetch(url);
    return await r.json();
  } catch(e){ return null; }
}

// Leave 3D mode: tell the parent viewer to switch back, or go to the main app
// when opened standalone.
function exitArena(){
  if (isEmbedded()){
    try { window.parent.postMessage({ type:'tzh-exit-3d' }, '*'); return; } catch(e){}
  }
  location.href = '/';
}

// Header nav (Members / Leaderboard / Join / Admin). The modals + admin panel
// live in the parent viewer (index.html), so when embedded we ask it to leave
// 3D and open the SAME feature the 2D nav opens. Standalone, we fall back to the
// main app (admin deep-links via ?admin, which index.html already honours).
function arenaNav(action){
  if (isEmbedded()){
    try { window.parent.postMessage({ type:'tzh-nav', action:action }, '*'); return; } catch(e){}
  }
  location.href = (action === 'admin') ? '/?admin' : '/';
}

/* =========================================================

var sceneApi = (function buildScene(){

  scene.add(grid);

  /* ---- Court factory ----
     Standard-ish proportions (not regulation): length(z) x width(x)
  */
  var COURT_L = 13.4;   // along z
  var COURT_W = 6.1;    // along x
  var lineMat = new THREE.LineBasicMaterial({ color:0xffffff, transparent:true, opacity:0.96 });  // court lines — white (real venue)
  var blueLineMat = new THREE.LineBasicMaterial({ color:BLUE, transparent:true, opacity:0.9 });    // blue accent lines (store etc.)
  var glowMat = new THREE.MeshBasicMaterial({ color:BLUE, transparent:true, opacity:0.22 });        // blue under-glow accent

  function makeRect(w, l, y, mat){
    var hw=w/2, hl=l/2;
    var pts = [
      new THREE.Vector3(-hw,y,-hl), new THREE.Vector3( hw,y,-hl),
      new THREE.Vector3( hw,y,-hl), new THREE.Vector3( hw,y, hl),
      new THREE.Vector3( hw,y, hl), new THREE.Vector3(-hw,y, hl),
      new THREE.Vector3(-hw,y, hl), new THREE.Vector3(-hw,y,-hl)

  }
  function makeLine(x1,z1,x2,z2,y){
    var g = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(x1,y,z1), new THREE.Vector3(x2,y,z2)
    ]);

  /* ---- Player profile avatars (billboarded tokens standing inside each court) ----
     Live photos arrive via the SHARED top-level PLAYER_PHOTOS map (name → data URL),
     populated by the data layer each refresh; missing → initials disc. avatarTexCache
     is cleared (clearAvatarCache) whenever the photo set changes so tokens re-render. */
  var avatarTexCache = {};
  function makeAvatarTexture(name){
    if(avatarTexCache[name]) return avatarTexCache[name];
    var S = 256;
    var c = document.createElement('canvas'); c.width = c.height = S;
    var ctx = c.getContext('2d');
    var cx = S/2, cy = S/2, r = S/2 - 14;
    function base(){
      ctx.clearRect(0,0,S,S);
      ctx.save();
      ctx.shadowColor='rgba(0,90,200,.5)'; ctx.shadowBlur=26; ctx.shadowOffsetY=6;
      var g = ctx.createLinearGradient(40,30,210,230);
      g.addColorStop(0,'#3a9bff'); g.addColorStop(1,'#005bb5');
      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
      ctx.restore();
    }
    function ring(){ ctx.lineWidth=14; ctx.strokeStyle='#ffffff';
      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke(); }
    function initialsLayer(){
      var hl = ctx.createRadialGradient(cx-40,cy-55,10,cx,cy,r);
      hl.addColorStop(0,'rgba(255,255,255,.32)'); hl.addColorStop(.55,'rgba(255,255,255,0)');
      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fillStyle=hl; ctx.fill();
      ctx.fillStyle='#ffffff';
      ctx.font='700 112px -apple-system,BlinkMacSystemFont,"SF Pro Display",Helvetica,Arial,sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(initials(name), cx, cy+8);
    }
    base();
    var tex = new THREE.CanvasTexture(c);
    tex.minFilter = THREE.LinearFilter;
    try{ if(renderer && renderer.capabilities) tex.anisotropy = renderer.capabilities.getMaxAnisotropy(); }catch(e){}
    var photo = PLAYER_PHOTOS[name];
    if(photo){
      var img = new Image();
      img.onload = function(){
        base();
        ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,r-2,0,Math.PI*2); ctx.clip();
        var s = Math.max((2*r)/img.width, (2*r)/img.height);
        var dw = img.width*s, dh = img.height*s;
        ctx.drawImage(img, cx-dw/2, cy-dh/2, dw, dh);
        ctx.restore();
        ring(); tex.needsUpdate = true;
      };
      img.onerror = function(){ initialsLayer(); ring(); tex.needsUpdate = true; };
      img.src = photo;
    } else {
      initialsLayer(); ring();
    }
    avatarTexCache[name] = tex;
    return tex;
  }
  /* glowing blue footprint under each token (reads on the dark court floor) */
  var _shadowTex;
  function shadowTexture(){
    if(_shadowTex) return _shadowTex;
    var S=128, c=document.createElement('canvas'); c.width=c.height=S;
    var ctx=c.getContext('2d');
    var g=ctx.createRadialGradient(S/2,S/2,2,S/2,S/2,S/2);
    g.addColorStop(0,'rgba(80,160,255,.6)'); g.addColorStop(0.55,'rgba(60,140,255,.18)'); g.addColorStop(1,'rgba(60,140,255,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,S,S);

  }
  function addPlayerToken(grp, name, x, z){
    var D = 1.8;                 // world diameter of the avatar
    var sp = new THREE.Sprite(new THREE.SpriteMaterial({
      map: makeAvatarTexture(name), transparent:true, depthWrite:false, depthTest:true
    }));
    sp.scale.set(D, D, 1);
    sp.position.set(x, 1.35, z);
    grp.add(sp);
    var glow = new THREE.Mesh(
      new THREE.PlaneGeometry(D*1.6, D*1.6),
      new THREE.MeshBasicMaterial({ map:shadowTexture(), transparent:true, depthWrite:false, blending:THREE.AdditiveBlending })
    );
    glow.rotation.x = -Math.PI/2; glow.position.set(x, 0.06, z);
    grp.add(glow);
  }
  /* place a team (1 player → centred, 2 players → left+right) on its half (at depth z) */
  function placeTeam(grp, players, z){
    var list = players || [];
    if(list.length === 1){ addPlayerToken(grp, list[0], 0, z); return; }
    list.slice(0,2).forEach(function(nm, i){ addPlayerToken(grp, nm, i===0 ? -1.5 : 1.5, z); });
  }

  function buildCourt(cx, cz, match){
    var grp = new THREE.Group();
    grp.position.set(cx, 0, cz);
    var y = 0.04;
    var hw=COURT_W/2, hl=COURT_L/2;

    /* dark glossy court surface (real venue) */
    var surfGeo = new THREE.PlaneGeometry(COURT_W, COURT_L);
    var surfMat = new THREE.MeshStandardMaterial({
      color:0x181b22, roughness:0.34, metalness:0.18
    });
    var surf = new THREE.Mesh(surfGeo, surfMat);
    surf.rotation.x = -Math.PI/2;
    surf.position.y = 0.015;
    grp.add(surf);

    /* glow halo under court */
    var halo = new THREE.Mesh(new THREE.PlaneGeometry(COURT_W+1.4, COURT_L+1.4), glowMat);
    halo.rotation.x = -Math.PI/2;
    halo.position.y = 0.008;
    grp.add(halo);

    /* outer boundary */
    grp.add(makeRect(COURT_W, COURT_L, y));
    /* inner singles side-lines */
    grp.add(makeLine(-hw+0.55,-hl,-hw+0.55,hl,y));
    grp.add(makeLine( hw-0.55,-hl, hw-0.55,hl,y));
    /* service lines (short of net) */
    grp.add(makeLine(-hw,-1.95, hw,-1.95,y));
    grp.add(makeLine(-hw, 1.95, hw, 1.95,y));
    /* back service / long service line */
    grp.add(makeLine(-hw,-hl+0.75, hw,-hl+0.75,y));
    grp.add(makeLine(-hw, hl-0.75, hw, hl-0.75,y));
    /* center service line (two halves) */
    grp.add(makeLine(0,-1.95,0,-hl+0.75,y));
    grp.add(makeLine(0, 1.95,0, hl-0.75,y));

    /* ---- Net at center ---- */
    var netH = 1.05;
    var netMat = new THREE.MeshBasicMaterial({
      color:0xffffff, transparent:true, opacity:0.10, side:THREE.DoubleSide, depthWrite:false
    });
    var net = new THREE.Mesh(new THREE.PlaneGeometry(COURT_W, netH), netMat);
    net.position.set(0, netH/2, 0);
    grp.add(net);
    /* net mesh lines */
    var netLineMat = new THREE.LineBasicMaterial({ color:0x9cc2f2, transparent:true, opacity:0.55 });
    var npts = [];
    var cols = 14;
    for(var i=0;i<=cols;i++){
      var xx = -hw + (COURT_W*i/cols);
      npts.push(new THREE.Vector3(xx,0,0), new THREE.Vector3(xx,netH,0));
    }
    var rows = 4;
    for(var r=0;r<=rows;r++){
      var yy = netH*r/rows;
      npts.push(new THREE.Vector3(-hw,yy,0), new THREE.Vector3(hw,yy,0));
    }
    var netGrid = new THREE.LineSegments(
      new THREE.BufferGeometry().setFromPoints(npts), netLineMat);
    grp.add(netGrid);
    /* bright net tape (top) */
    var tape = makeLine(-hw,0,hw,0,netH);
    grp.add(tape);
    /* net posts */
    var postMat = new THREE.MeshStandardMaterial({ color:0x0071e3, roughness:0.4, metalness:0.2, emissive:0x0a3a78, emissiveIntensity:0.35 });
    [-hw,hw].forEach(function(px){
      var post = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,netH+0.18,12), postMat);
      post.position.set(px,(netH+0.18)/2,0);
      grp.add(post);
    });

    /* ---- Players standing inside the court ----
       team1 on the near half (−z), team2 on the far half (+z) */
    if(match){
      var zHalf = COURT_L * 0.24;          // ~3.2 — mid of each service half
      placeTeam(grp, match.t1, -zHalf);
      placeTeam(grp, match.t2,  zHalf);
    }

    return grp;
  }

  /* ---- Floating pill label (billboarded): "STORE" / "COURT 1" … ---- */
  function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }
  function makeLabelSprite(text, opts){
    opts = opts || {};
    var store = !!opts.store;
    var fs = store ? 100 : 74;
    var font = '800 '+fs+'px -apple-system,BlinkMacSystemFont,"SF Pro Display",Helvetica,Arial,sans-serif';
    var m = document.createElement('canvas').getContext('2d');
    m.font = font;
    var tw = m.measureText(text).width;
    var padX = store ? 70 : 48, padY = store ? 42 : 32, GM = store ? 44 : 26;
    var W = Math.ceil(tw + padX*2), H = Math.ceil(fs + padY*2);
    var c = document.createElement('canvas');
    c.width = W + GM*2; c.height = H + GM*2;
    var ctx = c.getContext('2d');
    var ox = c.width/2, oy = c.height/2;
    if(store){ ctx.save(); ctx.shadowColor='rgba(0,140,255,.95)'; ctx.shadowBlur=48; }
    roundRect(ctx, GM, GM, W, H, H/2);
    if(store){
      var g = ctx.createLinearGradient(0,GM,0,GM+H);
      g.addColorStop(0,'#1f8bff'); g.addColorStop(1,'#0066cc');
      ctx.fillStyle = g; ctx.fill(); ctx.restore();
      ctx.lineWidth=5; ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.stroke();
      ctx.fillStyle='#ffffff';
    } else {
      ctx.fillStyle='rgba(255,255,255,.94)'; ctx.fill();
      ctx.lineWidth=3; ctx.strokeStyle='rgba(0,113,227,.55)'; ctx.stroke();
      ctx.fillStyle='#0a4da0';
    }
    ctx.font = font; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(text, ox, oy + (store?5:3));
    var tex = new THREE.CanvasTexture(c);
    tex.minFilter = THREE.LinearFilter;
    try{ if(renderer && renderer.capabilities) tex.anisotropy = renderer.capabilities.getMaxAnisotropy(); }catch(e){}
    var sp = new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, transparent:true, depthWrite:false }));
    var worldH = store ? 1.85 : 1.2;
    sp.scale.set(worldH * (c.width/c.height), worldH, 1);

  }

  /* ---- Stage: raised platform (maroon skirt + green carpet) with a backdrop ---- */

    carpet.rotation.x = -Math.PI/2; carpet.position.y = H + 0.01; g.add(carpet);
    var back = new THREE.Mesh(new THREE.BoxGeometry(W, 3.0, 0.18),
      new THREE.MeshStandardMaterial({ color:0x0e2548, roughness:0.5, metalness:0.2, emissive:0x0a2a55, emissiveIntensity:0.28 }));
    back.position.set(0, H + 1.5, D/2); g.add(back);
    var step = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.22, 0.6),
      new THREE.MeshStandardMaterial({ color:0x6a1a25, roughness:0.7 }));
    step.position.set(0, 0.11, -D/2 - 0.3); g.add(step);
    var lbl = makeLabelSprite('STAGE', {});
    lbl.scale.multiplyScalar(1.35);
    lbl.position.set(0, H + 3.6, 0); g.add(lbl);
    return g;
  }

  /* ---- Entrance: a glowing gateway arch ---- */
  function buildEntrance(cx, cz){
    var g = new THREE.Group(); g.position.set(cx, 0, cz);
    var PW = 0.42, PH = 3.4, gap = 3.4;
    var postMat = new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.6, metalness:0.06 });
    [-gap/2, gap/2].forEach(function(px){
      var post = new THREE.Mesh(new THREE.BoxGeometry(PW, PH, PW), postMat);
      post.position.set(px, PH/2, 0); g.add(post);
      g.add(new THREE.LineSegments(new THREE.EdgesGeometry(post.geometry), blueLineMat).translateX(px).translateY(PH/2));
    });
    var lintel = new THREE.Mesh(new THREE.BoxGeometry(gap + PW*2 + 0.5, 0.5, PW),
      new THREE.MeshStandardMaterial({ color:0x0071e3, roughness:0.5, metalness:0.2, emissive:0x0a3a78, emissiveIntensity:0.32 }));
    lintel.position.set(0, PH + 0.1, 0); g.add(lintel);
    g.add(mkPlane(gap, PH - 0.2, 0x86d8ff, 0.16, 0, PH/2, 0));   // soft glowing threshold
    var lbl = makeLabelSprite('ENTRANCE', {});
    lbl.scale.multiplyScalar(1.35);
    lbl.position.set(0, PH + 1.25, 0); g.add(lbl);
    return g;
  }

  /* ---- Toilet: small white block with a door ---- */
  function buildToilet(cx, cz){
    var g = new THREE.Group(); g.position.set(cx, 0, cz);
    var W = 3, H = 2.7, D = 3;
    var body = new THREE.Mesh(new THREE.BoxGeometry(W, H, D),
      new THREE.MeshStandardMaterial({ color:0xf4f7fc, roughness:0.6, metalness:0.05 }));
    body.position.y = H/2; g.add(body);
    g.add(new THREE.LineSegments(new THREE.EdgesGeometry(body.geometry), blueLineMat).translateY(H/2));
    var roof = new THREE.Mesh(new THREE.BoxGeometry(W + 0.3, 0.18, D + 0.3),
      new THREE.MeshStandardMaterial({ color:0x0071e3, roughness:0.5, metalness:0.2, emissive:0x0a3a78, emissiveIntensity:0.25 }));
    roof.position.y = H + 0.05; g.add(roof);
    g.add(mkPlane(1.0, 2.0, 0x12243f, 1, 0, 1.0, -D/2 - 0.01));   // door (faces camera)
    var lbl = makeLabelSprite('TOILET', {});
    lbl.scale.multiplyScalar(1.35);
    lbl.position.set(0, H + 1.3, 0); g.add(lbl);
    return g;
  }

  /* ---- floating soft accent ring (premium ambiance) — static, court-independent ---- */
  var ringMat = new THREE.MeshBasicMaterial({ color:BLUE, transparent:true, opacity:0.08, side:THREE.DoubleSide });
  var ring = new THREE.Mesh(new THREE.RingGeometry(33, 33.3, 120), ringMat);
  ring.rotation.x = -Math.PI/2; ring.position.set(0, 0.02, 0);
  scene.add(ring);

  /* =========================================================
     LIVE LAYOUT — courts + facilities are (re)built from the
     current match list so the arena always tracks real state.
       · Courts are centred on x=0 (Court 1 → +x … last → −x).
       · The Stage/Store/Entrance cluster flanks +x; Toilet flanks −x.
       · Facilities only rebuild when the court COUNT changes; courts
         rebuild whenever the matches change (round advance, edits…).
     ========================================================= */
  var PITCH = 9.4;
  var courtObjects = [];      // per-rebuild: court groups + their COURT labels
  var facilityObjects = [];   // rebuilt only when the court count changes
  var lastCourtCount = -1;

  // camera framing — mutated by reframe(), read by positionCamera()
  var R = 45, BASE_H = 28, CENTER_X = 0, SWEEP_MAX = 0.4;

  function disposeObject(obj){
    if(!obj) return;
    scene.remove(obj);
    obj.traverse && obj.traverse(function(o){
      if(o.geometry && o.geometry.dispose) o.geometry.dispose();
      if(o.material){
        var mats = Array.isArray(o.material) ? o.material : [o.material];
        mats.forEach(function(mm){ if(mm){ if(mm.map && mm.map.dispose) mm.map.dispose(); if(mm.dispose) mm.dispose(); } });
      }
    });
  }

  function rebuildFacilities(spanHalf){
    facilityObjects.forEach(disposeObject);
    facilityObjects = [];
    var CX = spanHalf + 13;                          // cluster just off the +x flank
    function add(obj, rotY){ obj.rotation.y = rotY; scene.add(obj); facilityObjects.push(obj); }
    add(buildStage(CX, -7.5),   Math.PI/2);          // Stage    — front
    add(buildStore(CX, 0),      Math.PI/2);          // Store    — middle
    add(buildEntrance(CX, 6.5), Math.PI/2);          // Entrance — back
    add(buildToilet(-(spanHalf + 16), -10), -Math.PI/2); // Toilet — opposite flank
  }

  // Adapt camera + facility layout to the number of courts on screen.
  function reframe(n){
    var spanHalf = (n - 1) / 2 * PITCH;              // courts centred on x=0
    CENTER_X  = 0;
    R         = Math.max(33, 30 + n * 4);
    BASE_H    = Math.max(22, 22 + n * 1.5);
    SWEEP_MAX = Math.min(0.42, 0.15 + n * 0.06);
    if(n !== lastCourtCount){
      lastCourtCount = n;
      rebuildFacilities(spanHalf);
    }
    return spanHalf;
  }

  // Rebuild courts (+ labels) from a fresh match list. Static scene (floor,
  // lights, ring) is untouched. Always renders one frame so the change is
  // visible immediately, even under prefers-reduced-motion.
  function rebuildCourts(matches){
    courtObjects.forEach(disposeObject);
    courtObjects = [];
    var n = matches.length;
    if(n === 0){ positionCamera(); renderer.render(scene, camera); return; }
    var spanHalf = reframe(n);
    matches.forEach(function(m, i){
      var x = spanHalf - i * PITCH;                  // Court 1 → +spanHalf … last → −spanHalf
      var court = buildCourt(x, 0, m);
      scene.add(court); courtObjects.push(court);
      var lbl = makeLabelSprite('COURT ' + m.court, {});
      lbl.position.set(x, 4.7, 0);
      scene.add(lbl); courtObjects.push(lbl);
    });
    positionCamera();
    renderer.render(scene, camera);
  }

  // Photo set changed → drop cached avatar textures so tokens repaint with the
  // latest PLAYER_PHOTOS (the shared top-level map).
  function clearAvatarCache(){ avatarTexCache = {}; }

  /* =========================================================
     RENDER LOOP — manual slow auto-orbit
     ========================================================= */
  var sweep = 0, sweepT = 0;
  var clock = new THREE.Clock();

  function positionCamera(){
    // front-of-row camera that gently dollies left↔right so the whole row stays framed
    camera.position.set(
      CENTER_X + Math.sin(sweep) * R,
      BASE_H + Math.cos(sweep) * 2.0,
      -Math.cos(sweep) * R
    );
    camera.lookAt(CENTER_X, 0.6, 0);
  }

  function frame(){
    if(!reduceMotion){
      sweepT += clock.getDelta();
      sweep = Math.sin(sweepT * 0.15) * SWEEP_MAX;
    }
    positionCamera();
    renderer.render(scene, camera);
    if(!reduceMotion) requestAnimationFrame(frame);
  }

  /* ---- Resize ---- */
  function onResize(){
    var w = window.innerWidth, h = window.innerHeight;
    camera.aspect = w/h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  }
  window.addEventListener('resize', onResize);

  positionCamera();
  if(reduceMotion){
    renderer.render(scene, camera); // freeze: render one frame
  } else {
    requestAnimationFrame(frame);
  }

  return { rebuildCourts: rebuildCourts, clearAvatarCache: clearAvatarCache, hasWebGL: true };
})();

/* =========================================================
   ORCHESTRATOR — pull live state, render cards + 3D, keep polling
   ========================================================= */
function applyArenaState(state){
  if(!state) return;
  if(state.locked){
    var el = document.getElementById('cards');
    if(el) el.innerHTML = '<div class="card glass" style="grid-column:1/-1;text-align:center;color:var(--ink-2)">This display is locked. Open it from the main viewer.</div>';
    var un = document.getElementById('upNext');
    if(un){ un.style.display = 'none'; un.innerHTML = ''; }
    return;
  }
  var matches = buildMatchesFromState(state);
  PLAYER_PHOTOS = buildPhotoMap(matches);   // shared map: cards + 3D tokens
  renderCards(matches);
  renderNextUp(state);
  updateHud(state, matches);
  if(sceneApi && sceneApi.rebuildCourts){
    sceneApi.clearAvatarCache();
    sceneApi.rebuildCourts(matches);
  }
}

var __arenaSig = null;
async function refreshArena(){
  var state = await fetchArenaState();
  if(!state) return;
  // cheap signature so we only rebuild when the live matches/date/up-next change
  var sig = state.locked ? 'locked' : JSON.stringify({
    m: buildMatchesFromState(state),
    d: state.sessionDate,
    n: buildNextUpFromState(state),
    s: state.showNextUp
  });
  if(sig === __arenaSig) return;
  __arenaSig = sig;
  applyArenaState(state);
}

(function initArena(){
  var exitBtn = document.getElementById('exit3d');
  if(exitBtn) exitBtn.addEventListener('click', exitArena);
  // header nav → open the matching feature in the parent viewer
  [['navMembers','members'],['navLeaderboard','leaderboard'],['navJoin','join'],['navAdmin','admin']]
    .forEach(function(pair){
      var b = document.getElementById(pair[0]);
      if(b) b.addEventListener('click', function(){ arenaNav(pair[1]); });
    });
  // Escape: when embedded, hand it to the host viewer (tzh-escape) — it closes
  // any nav panel open over the arena and only leaves 3D when nothing is open,
  // so Escape no longer drops you to 2D mid-panel. Standalone, just leave.
  window.addEventListener('keydown', function(e){
    if(e.key !== 'Escape') return;
    if(isEmbedded()){
      try { window.parent.postMessage({ type:'tzh-escape' }, '*'); return; } catch(err){}
    }
    exitArena();
  });
  refreshArena();
  setInterval(refreshArena, 3000);
})();
</script>
