<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TZH Badminton — Arena · Wave Terrain</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
  :root{
    --blue:#0071e3; --blue-2:#0066cc; --blue-dark:#005bb5; --blue-bright:#4f97ff;
    --blue-tint:rgba(79,151,255,.18); --blue-line:rgba(79,151,255,.40);
    --bg:#05132b; --bg-2:#020912; --card:#0a1a33; --card-2:#0e2244;
    --ink:#eaf2ff; --ink-2:#aebfd8; --ink-3:#8fa3c4; --line:rgba(120,170,255,.18);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 760px at 70% -12%, #0a1d40 0%, rgba(10,29,64,0) 60%),
      radial-gradient(900px 540px at 18% 112%, #061327 0%, rgba(6,19,39,0) 62%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  /* ---------- WebGL canvas backdrop ---------- */
  #scene{
    position:fixed; inset:0; width:100%; height:100%;
    display:block; z-index:0;
  }
  /* CSS fallback backdrop (visible if WebGL fails or behind transparent canvas) */
  #backdrop{
    position:fixed; inset:0; z-index:-1;
    background:
      radial-gradient(1000px 600px at 50% 18%, rgba(79,151,255,.14), rgba(79,151,255,0) 60%),
      radial-gradient(1100px 680px at 50% 96%, rgba(0,113,227,.18), rgba(0,113,227,0) 60%),
      radial-gradient(700px 700px at 50% 60%, rgba(7,30,70,.55), rgba(7,30,70,0) 70%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
  }

  /* ---------- HUD overlay ---------- */
  #hud{
    position:fixed; inset:0; z-index:10;
    display:flex; flex-direction:column;
    padding:26px clamp(24px,3.4vw,56px) 22px;
    pointer-events:none; /* let drags pass to scene; panels re-enable */
  }
  .hud-panel{ pointer-events:auto; }

  /* glass surface — dark frosted */
  .glass{
    background:linear-gradient(180deg, rgba(10,26,51,.62), rgba(8,20,40,.5));
    border:1px solid rgba(120,170,255,.22);
    box-shadow:
      0 1px 0 rgba(140,185,255,.10) inset,
      0 18px 54px -22px rgba(0,0,0,.7),
      0 2px 12px -4px rgba(0,20,60,.5);
    -webkit-backdrop-filter:saturate(1.35) blur(18px);
    backdrop-filter:saturate(1.35) blur(18px);
  }

  /* ===== Header ===== */
  header{
    display:flex; align-items:center; gap:18px;
    padding:12px 18px; border-radius:18px;
  }
  header img{
    height:46px; width:auto; display:block;
    filter:drop-shadow(0 0 10px rgba(79,151,255,.45));
  }
  .brand{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .brand h1{
    font-size:19px; font-weight:650; letter-spacing:-.02em; color:var(--ink);
    line-height:1;
  }
  .brand .date{ font-size:12.5px; color:var(--ink-2); font-weight:480; letter-spacing:.01em; }
  .header-spacer{ flex:1 1 auto; }

  .live{
    display:inline-flex; align-items:center; gap:8px;
    padding:7px 13px 7px 11px; border-radius:999px;
    background:var(--blue-tint); border:1px solid var(--blue-line);
    font-size:12px; font-weight:600; color:#cfe2ff; letter-spacing:.04em;
    text-transform:uppercase;
    box-shadow:0 0 18px -4px rgba(79,151,255,.4);
  }
  .live .dot{
    width:9px; height:9px; border-radius:50%;
    background:var(--blue-bright);
    box-shadow:0 0 0 0 rgba(79,151,255,.6);
    animation:pulse 1.8s ease-out infinite;
  }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(79,151,255,.6); }
    70%{ box-shadow:0 0 0 9px rgba(79,151,255,0); }
    100%{ box-shadow:0 0 0 0 rgba(79,151,255,0); }
  }
  .nav{ display:flex; gap:9px; }
  .pill{
    padding:8px 16px; border-radius:999px;
    font-size:13px; font-weight:550; color:var(--ink-2);
    background:rgba(120,170,255,.07);
    border:1px solid var(--line);
    transition:.18s ease;
  }
  .pill:hover{ color:#cfe2ff; border-color:var(--blue-line); background:var(--blue-tint); }
  .pill.active{ color:#fff; background:linear-gradient(180deg,var(--blue-bright),var(--blue)); border-color:transparent; box-shadow:0 6px 20px -6px rgba(79,151,255,.7); }

  /* ===== Center stage spacer ===== */
  .stage{ flex:1 1 auto; min-height:0; }

  /* ===== Match cards (bottom strip) ===== */
  .cards{
    pointer-events:none;
    display:grid; grid-template-columns:repeat(4,1fr);
    gap:16px;
  }
  .card{
    pointer-events:auto;
    border-radius:18px; padding:15px 16px 14px;
    display:flex; flex-direction:column; gap:12px;
    position:relative; overflow:hidden;
  }
  .card::before{ /* top accent hairline */
    content:""; position:absolute; left:16px; right:16px; top:0; height:2px;
    background:linear-gradient(90deg, transparent, var(--blue-bright), transparent);
    opacity:.7;
  }
  .card-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .court-id{ display:flex; align-items:center; gap:8px; }
  .court-num{
    font-size:13px; font-weight:680; letter-spacing:-.01em; color:var(--ink);
  }
  .court-num span{ color:var(--ink-3); font-weight:520; }
  .round-badge{
    font-size:10.5px; font-weight:650; letter-spacing:.05em; text-transform:uppercase;
    color:#cfe2ff;
    padding:4px 9px; border-radius:999px;
    background:var(--blue-tint); border:1px solid var(--blue-line);
    box-shadow:0 0 14px -4px rgba(79,151,255,.45);
  }

  .team{ display:flex; align-items:center; gap:10px; }
  .avatars{ display:flex; }
  .avatars .av:nth-child(2){ margin-left:-9px; }
  .av{
    width:32px; height:32px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:670; letter-spacing:.01em; color:#fff;
    background:linear-gradient(155deg, var(--blue-bright) 0%, var(--blue-dark) 100%);
    border:2px solid rgba(13,30,58,.95);
    box-shadow:0 3px 10px -3px rgba(79,151,255,.6);
    flex:0 0 auto;
  }
  .av.alt{ background:linear-gradient(155deg, #6fb0ff 0%, var(--blue-2) 100%); }
  .names{ display:flex; flex-direction:column; gap:1px; min-width:0; line-height:1.18; }
  .names .n{ font-size:12.5px; font-weight:560; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .vs-row{ display:flex; align-items:center; gap:10px; }
  .vs-line{ flex:1; height:1px; background:linear-gradient(90deg,transparent,var(--line),transparent); }
  .vs{
    font-size:10.5px; font-weight:700; letter-spacing:.12em; color:var(--blue-bright);
    text-transform:uppercase;
  }

  /* ===== Footer ===== */
  footer{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:16px;
    font-size:12px; color:var(--ink-2); letter-spacing:.01em;
    padding:0 4px;
  }
  footer .right{ color:var(--ink-3); font-weight:520; }
  footer strong{ color:var(--ink); font-weight:600; }

  @media (max-width:1080px){
    .cards{ grid-template-columns:repeat(2,1fr); }
  }
  @media (max-width:620px){
    .cards{ grid-template-columns:1fr; }
    .nav{ display:none; }
  }
</style>
</head>
<body>
  <div id="backdrop"></div>
  <canvas id="scene"></canvas>

  <div id="hud">
    <!-- Header -->
    <header class="hud-panel glass">
      <img src="logo.png" alt="TZH" onerror="this.style.display='none'" />
      <div class="brand">
        <h1>TZH Badminton</h1>
        <div class="date">Saturday 28 June 2026</div>
      </div>
      <div class="header-spacer"></div>
      <div class="live"><span class="dot"></span>Live</div>
      <nav class="nav">
        <span class="pill">Members</span>
        <span class="pill active">Leaderboard</span>
      </nav>
    </header>

    <div class="stage"></div>

    <!-- Match cards -->
    <div class="cards" id="cards"></div>

    <!-- Footer -->
    <footer class="hud-panel">
      <div class="left">TZH Badminton — Live Court Display</div>
      <div class="right"><strong>4 courts</strong> · Round 3 · 16 players</div>
    </footer>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =========================================================
   CONTENT MODEL
   ========================================================= */
function initials(name){
  return name.trim().split(/\s+/).map(function(w){return w[0];}).join('').slice(0,2).toUpperCase();
}
var MATCHES = [
  { court:1, round:3, t1:["Thomas Wong","Mei Lin"],   t2:["David Park","Sarah Chen"] },
  { court:2, round:3, t1:["Aiden Lee","Priya Nair"],  t2:["Marcus Tan","Yuki Sato"] },
  { court:3, round:2, t1:["Carlos Diaz","Hannah Kim"],t2:["Leo Zhang","Nina Patel"] },
  { court:4, round:2, t1:["Ravi Kumar","Sofia Reyes"],t2:["Ben Carter","Grace Lim"] }
];

function teamHTML(players, alt){
  var avs = players.map(function(p,i){
    return '<div class="av'+((alt|| i===1)?' alt':'')+'">'+initials(p)+'</div>';
  }).join('');
  var nms = players.map(function(p){ return '<div class="n">'+p+'</div>'; }).join('');
  return '<div class="team"><div class="avatars">'+avs+'</div><div class="names">'+nms+'</div></div>';
}

(function renderCards(){
  var el = document.getElementById('cards');
  el.innerHTML = MATCHES.map(function(m){
    return ''+
    '<div class="card glass">'+
      '<div class="card-top">'+
        '<div class="court-id"><span class="court-num">Court '+m.court+' <span>·</span></span>'+
          '<span class="round-badge">Round '+m.round+'</span></div>'+
      '</div>'+
      teamHTML(m.t1, false)+
      '<div class="vs-row"><span class="vs-line"></span><span class="vs">vs</span><span class="vs-line"></span></div>'+
      teamHTML(m.t2, true)+
    '</div>';
  }).join('');
})();

/* =========================================================
   THREE.JS WAVE TERRAIN SCENE
   ========================================================= */
(function buildScene(){
  if(typeof THREE === 'undefined'){
    console.warn('THREE not available — using CSS backdrop only.');
    return; // CSS backdrop already visible
  }

  var reduceMotion = window.matchMedia &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var canvas = document.getElementById('scene');
  var renderer, scene, camera;

  try {
    renderer = new THREE.WebGLRenderer({
      canvas: canvas, antialias:true, alpha:true
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
  } catch(err){
    console.warn('WebGL init failed — CSS backdrop fallback active.', err);
    canvas.style.display = 'none';
    return;
  }

  scene = new THREE.Scene();
  var FOG = 0x040f24;             // deep navy — distant waves melt into the dark
  scene.background = new THREE.Color(FOG);
  scene.fog = new THREE.Fog(FOG, 28, 165);

  camera = new THREE.PerspectiveCamera(58, window.innerWidth/window.innerHeight, 0.1, 600);

  var BLUE        = 0x2f6fd0;     // trough blue
  var BLUE_BRIGHT = 0x4f97ff;     // crest blue
  var CYAN        = 0x73c6ff;     // crest sparkle

  /* ---- Faint ambient so the wireframe colors stay true; lights only feed normals ---- */
  scene.add(new THREE.HemisphereLight(0x21436e, 0x020912, 0.35));
  var key = new THREE.DirectionalLight(0x6fa6ff, 0.25);
  key.position.set(0, 40, -60);
  scene.add(key);

  /* =========================================================
     WAVE TERRAIN — large plane displaced each frame
     ========================================================= */
  var SEG   = 190;                // segments per side (<=200 for smooth per-frame update)
  var SIZE  = 360;                // world span — runs far into the distance
  var geo = new THREE.PlaneGeometry(SIZE, SIZE, SEG, SEG);
  geo.rotateX(-Math.PI / 2);      // lay flat: height now lives on .y

  var pos  = geo.attributes.position;
  var vcnt = pos.count;
  /* cache the rest (flat) x,z so wave math always samples the static grid */
  var baseX = new Float32Array(vcnt);
  var baseZ = new Float32Array(vcnt);
  for(var i=0;i<vcnt;i++){ baseX[i]=pos.getX(i); baseZ[i]=pos.getZ(i); }

  /* per-vertex color buffer — tint crests brighter than troughs */
  var colArr = new Float32Array(vcnt * 3);
  geo.setAttribute('color', new THREE.BufferAttribute(colArr, 3));

  var cTrough = new THREE.Color(BLUE);
  var cCrest  = new THREE.Color(BLUE_BRIGHT);
  var cSpark  = new THREE.Color(CYAN);

  /* layered-wave height field (organic rolling ocean) */
  function waveHeight(x, z, t){
    var h = 0;
    h += Math.sin(x * 0.045 + t * 0.85) * 5.2;
    h += Math.cos(z * 0.055 + t * 1.05) * 4.4;
    h += Math.sin((x + z) * 0.038 + t * 0.62) * 2.6;   // diagonal cross-term
    h += Math.cos((x * 0.11 - z * 0.09) + t * 1.55) * 1.5;
    h += Math.sin(x * 0.20 + z * 0.13 + t * 2.1) * 0.7; // fine chop
    return h;
  }

  var MIN_H = -8, MAX_H = 9;      // approx range for color normalisation
  var tmpCol = new THREE.Color();

  function updateTerrain(t){
    for(var i=0;i<vcnt;i++){
      var x = baseX[i], z = baseZ[i];
      var h = waveHeight(x, z, t);
      pos.setY(i, h);

      /* crest height → color: trough blue → crest blue → cyan sparkle on peaks */
      var n = (h - MIN_H) / (MAX_H - MIN_H);          // 0..1
      if(n < 0) n = 0; else if(n > 1) n = 1;
      if(n < 0.72){
        tmpCol.copy(cTrough).lerp(cCrest, n / 0.72);
      } else {
        tmpCol.copy(cCrest).lerp(cSpark, (n - 0.72) / 0.28);
      }
      colArr[i*3]   = tmpCol.r;
      colArr[i*3+1] = tmpCol.g;
      colArr[i*3+2] = tmpCol.b;
    }
    pos.needsUpdate = true;
    geo.attributes.color.needsUpdate = true;
    geo.computeVertexNormals();
  }

  /* ---- glowing blue light-grid: WIREFRAME terrain ---- */
  var wireMat = new THREE.MeshBasicMaterial({
    vertexColors:true, wireframe:true,
    transparent:true, opacity:0.62,
    fog:true
  });
  var terrain = new THREE.Mesh(geo, wireMat);
  scene.add(terrain);

  /* ---- vertex sparkle: additive blue points at every grid vertex (crests sparkle) ---- */
  var ptsMat = new THREE.PointsMaterial({
    vertexColors:true, size:0.62, sizeAttenuation:true,
    transparent:true, opacity:0.85, depthWrite:false,
    blending:THREE.AdditiveBlending, fog:true
  });
  var points = new THREE.Points(geo, ptsMat);  // shares displaced+colored geometry
  scene.add(points);

  /* =========================================================
     DEPTH ACCENTS — sparse glowing beacon pillars on distant peaks
     ========================================================= */
  var beacons = [];
  var beaconMat = new THREE.MeshBasicMaterial({
    color:0x6fb0ff, transparent:true, opacity:0.40,
    depthWrite:false, blending:THREE.AdditiveBlending, fog:true
  });
  var capMat = new THREE.MeshBasicMaterial({
    color:0xbfe0ff, transparent:true, opacity:0.85,
    depthWrite:false, blending:THREE.AdditiveBlending, fog:true
  });
  /* place a handful far down-field, spread across x, riding on the surface */
  var beaconSpots = [
    [-72, -118], [ 40, -150], [-18, -98], [ 88, -132], [-110, -140], [ 16, -176]
  ];
  beaconSpots.forEach(function(s){
    var bx = s[0], bz = s[1];
    var H = 26 + Math.random() * 14;
    var pillar = new THREE.Mesh(
      new THREE.CylinderGeometry(0.18, 0.42, H, 8, 1, true),
      beaconMat
    );
    pillar.position.set(bx, H * 0.5, bz);
    scene.add(pillar);
    var cap = new THREE.Mesh(new THREE.SphereGeometry(0.7, 12, 10), capMat);
    cap.position.set(bx, H, bz);
    scene.add(cap);
    beacons.push({ x:bx, z:bz, h:H, pillar:pillar, cap:cap });
  });

  function settleBeacons(t){
    /* keep each beacon's foot riding on the wave crest beneath it */
    for(var i=0;i<beacons.length;i++){
      var b = beacons[i];
      var surf = waveHeight(b.x, b.z, t);
      b.pillar.position.y = surf + b.h * 0.5;
      b.cap.position.y = surf + b.h;
    }
  }

  /* =========================================================
     CAMERA — low near the surface, slow drift, mouse steers
     ========================================================= */
  var BASE_Y   = 9.5;             // low, near the swells
  var BASE_Z   = 78;              // sits back; looks toward the horizon
  var LOOK     = new THREE.Vector3(0, 2.5, -80);

  var targetYaw = 0, targetPitch = 0;   // mouse-steered (small range)
  var curYaw = 0, curPitch = 0;
  var mouseRaf = false;
  function onMouse(e){
    if(mouseRaf) return;
    mouseRaf = true;
    requestAnimationFrame(function(){
      var nx = (e.clientX / window.innerWidth)  * 2 - 1;
      var ny = (e.clientY / window.innerHeight) * 2 - 1;
      targetYaw   = nx * 0.16;     // gentle yaw range
      targetPitch = -ny * 0.10;    // gentle pitch range
      mouseRaf = false;
    });
  }
  window.addEventListener('mousemove', onMouse);

  function positionCamera(t){
    /* very slow lateral + bob drift, layered with eased mouse steer */
    curYaw   += (targetYaw   - curYaw)   * 0.05;
    curPitch += (targetPitch - curPitch) * 0.05;

    var driftX = Math.sin(t * 0.06) * 6;
    var bob    = Math.sin(t * 0.5) * 0.5;

    camera.position.set(
      driftX + curYaw * 40,
      BASE_Y + bob + curPitch * 22,
      BASE_Z
    );
    LOOK.set(driftX * 0.4 + curYaw * 30, 2.5 + curPitch * 14, -80);
    camera.lookAt(LOOK);
  }

  /* =========================================================
     RENDER LOOP — INFINITE DRIFT toward the camera
     ========================================================= */
  var clock = new THREE.Clock();
  var phase = 0;                  // wave phase — advances so swells roll toward camera

  function frame(){
    var dt = clock.getDelta();
    phase += dt * 1.0;            // continuous swell advance
    updateTerrain(phase);
    settleBeacons(phase);
    positionCamera(clock.elapsedTime);
    renderer.render(scene, camera);
    if(!reduceMotion) requestAnimationFrame(frame);
  }

  /* ---- Resize ---- */
  function onResize(){
    var w = window.innerWidth, h = window.innerHeight;
    camera.aspect = w/h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  }
  window.addEventListener('resize', onResize);

  if(reduceMotion){
    /* freeze: build one static frame of the terrain, no animation/drift */
    updateTerrain(0);
    settleBeacons(0);
    positionCamera(0);
    renderer.render(scene, camera);
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
