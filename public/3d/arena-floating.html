<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TZH Badminton — Arena (Floating Courts)</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
  :root{
    --blue:#0071e3; --blue-2:#0066cc; --blue-dark:#005bb5;
    --blue-tint:rgba(0,113,227,.16); --blue-line:rgba(0,113,227,.42);
    --bg:#eef4fd; --bg-2:#e8f0fb; --card:#ffffff; --card-2:#e2ecfa;
    --ink:#1d1d1f; --ink-2:#5c6470; --ink-3:#5f6b7a; --line:#d4e2f5;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 700px at 70% -10%, #ffffff 0%, rgba(255,255,255,0) 60%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  /* ---------- WebGL canvas backdrop ---------- */
  #scene{
    position:fixed; inset:0; width:100%; height:100%;
    display:block; z-index:0;
  }
  /* CSS fallback backdrop (visible if WebGL fails or behind transparent canvas) */
  #backdrop{
    position:fixed; inset:0; z-index:-1;
    background:
      radial-gradient(900px 560px at 50% -8%, #ffffff 0%, rgba(255,255,255,0) 64%),
      radial-gradient(800px 480px at 24% 30%, rgba(0,113,227,.10), rgba(0,113,227,0) 60%),
      radial-gradient(900px 560px at 82% 80%, rgba(0,102,204,.12), rgba(0,102,204,0) 62%),
      linear-gradient(180deg, #f6faff 0%, var(--bg) 46%, var(--bg-2) 100%);
  }

  /* ---------- HUD overlay ---------- */
  #hud{
    position:fixed; inset:0; z-index:10;
    display:flex; flex-direction:column;
    padding:26px clamp(24px,3.4vw,56px) 22px;
    pointer-events:none; /* let drags pass to scene; panels re-enable */
  }
  .hud-panel{ pointer-events:auto; }

  /* glass surface */
  .glass{
    background:linear-gradient(180deg, rgba(255,255,255,.82), rgba(255,255,255,.66));
    border:1px solid rgba(255,255,255,.85);
    box-shadow:
      0 1px 0 rgba(255,255,255,.9) inset,
      0 18px 50px -22px rgba(20,52,99,.45),
      0 2px 10px -4px rgba(20,52,99,.22);
    -webkit-backdrop-filter:saturate(1.5) blur(18px);
    backdrop-filter:saturate(1.5) blur(18px);
  }

  /* ===== Header ===== */
  header{
    display:flex; align-items:center; gap:18px;
    padding:12px 18px; border-radius:18px;
  }
  header img{ height:46px; width:auto; display:block; }
  .brand{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .brand h1{
    font-size:19px; font-weight:650; letter-spacing:-.02em; color:var(--ink);
    line-height:1;
  }
  .brand .date{ font-size:12.5px; color:var(--ink-2); font-weight:480; letter-spacing:.01em; }
  .header-spacer{ flex:1 1 auto; }

  .live{
    display:inline-flex; align-items:center; gap:8px;
    padding:7px 13px 7px 11px; border-radius:999px;
    background:var(--blue-tint); border:1px solid var(--blue-line);
    font-size:12px; font-weight:600; color:var(--blue-dark); letter-spacing:.04em;
    text-transform:uppercase;
  }
  .live .dot{
    width:9px; height:9px; border-radius:50%;
    background:var(--blue);
    box-shadow:0 0 0 0 rgba(0,113,227,.55);
    animation:pulse 1.8s ease-out infinite;
  }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(0,113,227,.55); }
    70%{ box-shadow:0 0 0 9px rgba(0,113,227,0); }
    100%{ box-shadow:0 0 0 0 rgba(0,113,227,0); }
  }
  .nav{ display:flex; gap:9px; }
  .pill{
    padding:8px 16px; border-radius:999px;
    font-size:13px; font-weight:550; color:var(--ink-2);
    background:rgba(255,255,255,.6);
    border:1px solid var(--line);
    transition:.18s ease;
  }
  .pill:hover{ color:var(--blue-dark); border-color:var(--blue-line); background:var(--blue-tint); }
  .pill.active{ color:#fff; background:linear-gradient(180deg,var(--blue),var(--blue-2)); border-color:transparent; box-shadow:0 6px 16px -6px rgba(0,113,227,.6); }

  /* ===== Center stage spacer ===== */
  .stage{ flex:1 1 auto; min-height:0; }

  /* ===== Match cards (bottom strip) ===== */
  .cards{
    pointer-events:none;
    display:grid; grid-template-columns:repeat(4,1fr);
    gap:16px;
  }
  .card{
    pointer-events:auto;
    border-radius:18px; padding:15px 16px 14px;
    display:flex; flex-direction:column; gap:12px;
    position:relative; overflow:hidden;
  }
  .card::before{ /* top accent hairline */
    content:""; position:absolute; left:16px; right:16px; top:0; height:2px;
    background:linear-gradient(90deg, transparent, var(--blue-line), transparent);
  }
  .card-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .court-id{ display:flex; align-items:center; gap:8px; }
  .court-num{
    font-size:13px; font-weight:680; letter-spacing:-.01em; color:var(--ink);
  }
  .court-num span{ color:var(--ink-3); font-weight:520; }
  .round-badge{
    font-size:10.5px; font-weight:650; letter-spacing:.05em; text-transform:uppercase;
    color:var(--blue-dark);
    padding:4px 9px; border-radius:999px;
    background:var(--blue-tint); border:1px solid var(--blue-line);
  }

  .team{ display:flex; align-items:center; gap:10px; }
  .avatars{ display:flex; }
  .avatars .av:nth-child(2){ margin-left:-9px; }
  .av{
    width:32px; height:32px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:670; letter-spacing:.01em; color:#fff;
    background:linear-gradient(155deg, var(--blue) 0%, var(--blue-dark) 100%);
    border:2px solid #fff;
    box-shadow:0 3px 8px -3px rgba(0,113,227,.55);
    flex:0 0 auto;
  }
  .av.alt{ background:linear-gradient(155deg, #4a9bf0 0%, var(--blue-2) 100%); }
  .names{ display:flex; flex-direction:column; gap:1px; min-width:0; line-height:1.18; }
  .names .n{ font-size:12.5px; font-weight:560; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .vs-row{ display:flex; align-items:center; gap:10px; }
  .vs-line{ flex:1; height:1px; background:linear-gradient(90deg,transparent,var(--line),transparent); }
  .vs{
    font-size:10.5px; font-weight:700; letter-spacing:.12em; color:var(--blue);
    text-transform:uppercase;
  }

  /* ===== Footer ===== */
  footer{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:16px;
    font-size:12px; color:var(--ink-2); letter-spacing:.01em;
    padding:0 4px;
  }
  footer .right{ color:var(--ink-3); font-weight:520; }
  footer strong{ color:var(--ink); font-weight:600; }

  @media (max-width:1080px){
    .cards{ grid-template-columns:repeat(2,1fr); }
  }
  @media (max-width:620px){
    .cards{ grid-template-columns:1fr; }
    .nav{ display:none; }
  }
</style>
</head>
<body>
  <div id="backdrop"></div>
  <canvas id="scene"></canvas>

  <div id="hud">
    <!-- Header -->
    <header class="hud-panel glass">
      <img src="logo.png" alt="TZH" onerror="this.style.display='none'" />
      <div class="brand">
        <h1>TZH Badminton</h1>
        <div class="date">Saturday 28 June 2026</div>
      </div>
      <div class="header-spacer"></div>
      <div class="live"><span class="dot"></span>Live</div>
      <nav class="nav">
        <span class="pill">Members</span>
        <span class="pill active">Leaderboard</span>
      </nav>
    </header>

    <div class="stage"></div>

    <!-- Match cards -->
    <div class="cards" id="cards"></div>

    <!-- Footer -->
    <footer class="hud-panel">
      <div class="left">TZH Badminton — Live Court Display</div>
      <div class="right"><strong>4 courts</strong> · Round 3 · 16 players</div>
    </footer>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =========================================================
   CONTENT MODEL
   ========================================================= */
function initials(name){
  return name.trim().split(/\s+/).map(function(w){return w[0];}).join('').slice(0,2).toUpperCase();
}
var MATCHES = [
  { court:1, round:3, t1:["Thomas Wong","Mei Lin"],   t2:["David Park","Sarah Chen"] },
  { court:2, round:3, t1:["Aiden Lee","Priya Nair"],  t2:["Marcus Tan","Yuki Sato"] },
  { court:3, round:2, t1:["Carlos Diaz","Hannah Kim"],t2:["Leo Zhang","Nina Patel"] },
  { court:4, round:2, t1:["Ravi Kumar","Sofia Reyes"],t2:["Ben Carter","Grace Lim"] }
];

function teamHTML(players, alt){
  var avs = players.map(function(p,i){
    return '<div class="av'+((alt|| i===1)?' alt':'')+'">'+initials(p)+'</div>';
  }).join('');
  var nms = players.map(function(p){ return '<div class="n">'+p+'</div>'; }).join('');
  return '<div class="team"><div class="avatars">'+avs+'</div><div class="names">'+nms+'</div></div>';
}

(function renderCards(){
  var el = document.getElementById('cards');
  el.innerHTML = MATCHES.map(function(m){
    return ''+
    '<div class="card glass">'+
      '<div class="card-top">'+
        '<div class="court-id"><span class="court-num">Court '+m.court+' <span>·</span></span>'+
          '<span class="round-badge">Round '+m.round+'</span></div>'+
      '</div>'+
      teamHTML(m.t1, false)+
      '<div class="vs-row"><span class="vs-line"></span><span class="vs">vs</span><span class="vs-line"></span></div>'+
      teamHTML(m.t2, true)+
    '</div>';
  }).join('');
})();

/* =========================================================
   THREE.JS ARENA SCENE — FLOATING COURTS
   Four courts, each on its own floating sky island at a
   different height, gently bobbing & drifting in bright air.
   ========================================================= */
(function buildScene(){
  if(typeof THREE === 'undefined'){
    console.warn('THREE not available — using CSS backdrop only.');
    return; // CSS backdrop already visible
  }

  var reduceMotion = window.matchMedia &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var canvas = document.getElementById('scene');
  var renderer, scene, camera;

  try {
    renderer = new THREE.WebGLRenderer({
      canvas: canvas, antialias:true, alpha:true
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
  } catch(err){
    console.warn('WebGL init failed — CSS backdrop fallback active.', err);
    canvas.style.display = 'none';
    return;
  }

  scene = new THREE.Scene();
  /* bright airy sky — light at top, a touch bluer toward the bottom */
  var SKY_TOP = 0xf7fbff;
  var FOG = 0xe9f1fd;
  scene.background = new THREE.Color(SKY_TOP);
  scene.fog = new THREE.Fog(FOG, 34, 120);

  camera = new THREE.PerspectiveCamera(46, window.innerWidth/window.innerHeight, 0.1, 400);

  var CENTER = new THREE.Vector3(0, 0.4, 0);

  /* ---- Lights (bright & clean) ---- */
  scene.add(new THREE.HemisphereLight(0xffffff, 0xd2e4fb, 1.08));
  var dir = new THREE.DirectionalLight(0xffffff, 0.58);
  dir.position.set(14, 30, 12);
  scene.add(dir);
  var fill = new THREE.DirectionalLight(0xbcd6ff, 0.32);
  fill.position.set(-16, 16, -10);
  scene.add(fill);
  /* faint warm-cool top glow sphere so the "sky" reads as bright air */
  var skyDomeMat = new THREE.MeshBasicMaterial({
    color:0xeef5ff, side:THREE.BackSide, transparent:true, opacity:0.9, fog:false
  });
  var skyDome = new THREE.Mesh(new THREE.SphereGeometry(200, 24, 16), skyDomeMat);
  scene.add(skyDome);

  var BLUE = 0x0071e3;

  /* ---- Faint "ground far away" — pushed far below the islands ---- */
  var farGeo = new THREE.PlaneGeometry(420, 420);
  var farMat = new THREE.MeshStandardMaterial({
    color:0xeaf2fe, roughness:1.0, metalness:0.0,
    transparent:true, opacity:0.35
  });
  var farGround = new THREE.Mesh(farGeo, farMat);
  farGround.rotation.x = -Math.PI/2;
  farGround.position.y = -26;
  scene.add(farGround);

  /* =========================================================
     COURT FACTORY (preserved from original)
     Builds court surface + glowing lines + net + posts onto a group.
     ========================================================= */
  var COURT_L = 13.4;   // along z
  var COURT_W = 6.1;    // along x
  var lineMat = new THREE.LineBasicMaterial({ color:BLUE, transparent:true, opacity:0.92 });
  var glowMat = new THREE.MeshBasicMaterial({ color:BLUE, transparent:true, opacity:0.16 });

  function makeRect(w, l, y){
    var hw=w/2, hl=l/2;
    var pts = [
      new THREE.Vector3(-hw,y,-hl), new THREE.Vector3( hw,y,-hl),
      new THREE.Vector3( hw,y,-hl), new THREE.Vector3( hw,y, hl),
      new THREE.Vector3( hw,y, hl), new THREE.Vector3(-hw,y, hl),
      new THREE.Vector3(-hw,y, hl), new THREE.Vector3(-hw,y,-hl)
    ];
    var g = new THREE.BufferGeometry().setFromPoints(pts);
    return new THREE.LineSegments(g, lineMat);
  }
  function makeLine(x1,z1,x2,z2,y){
    var g = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(x1,y,z1), new THREE.Vector3(x2,y,z2)
    ]);
    return new THREE.LineSegments(g, lineMat);
  }

  function buildCourtLines(grp){
    var y = 0.04;
    var hw=COURT_W/2, hl=COURT_L/2;

    /* faint blue court surface */
    var surfGeo = new THREE.PlaneGeometry(COURT_W, COURT_L);
    var surfMat = new THREE.MeshStandardMaterial({
      color:0xe6f0fe, roughness:0.85, metalness:0.0,
      transparent:true, opacity:0.95
    });
    var surf = new THREE.Mesh(surfGeo, surfMat);
    surf.rotation.x = -Math.PI/2;
    surf.position.y = 0.015;
    grp.add(surf);

    /* glow halo under court lines */
    var halo = new THREE.Mesh(new THREE.PlaneGeometry(COURT_W+1.4, COURT_L+1.4), glowMat);
    halo.rotation.x = -Math.PI/2;
    halo.position.y = 0.008;
    grp.add(halo);

    /* outer boundary */
    grp.add(makeRect(COURT_W, COURT_L, y));
    /* inner singles side-lines */
    grp.add(makeLine(-hw+0.55,-hl,-hw+0.55,hl,y));
    grp.add(makeLine( hw-0.55,-hl, hw-0.55,hl,y));
    /* service lines (short of net) */
    grp.add(makeLine(-hw,-1.95, hw,-1.95,y));
    grp.add(makeLine(-hw, 1.95, hw, 1.95,y));
    /* back service / long service line */
    grp.add(makeLine(-hw,-hl+0.75, hw,-hl+0.75,y));
    grp.add(makeLine(-hw, hl-0.75, hw, hl-0.75,y));
    /* center service line (two halves) */
    grp.add(makeLine(0,-1.95,0,-hl+0.75,y));
    grp.add(makeLine(0, 1.95,0, hl-0.75,y));

    /* ---- Net at center ---- */
    var netH = 1.05;
    var netMat = new THREE.MeshBasicMaterial({
      color:0xffffff, transparent:true, opacity:0.10, side:THREE.DoubleSide
    });
    var net = new THREE.Mesh(new THREE.PlaneGeometry(COURT_W, netH), netMat);
    net.position.set(0, netH/2, 0);
    grp.add(net);
    /* net mesh lines */
    var netLineMat = new THREE.LineBasicMaterial({ color:0x9cc2f2, transparent:true, opacity:0.55 });
    var npts = [];
    var cols = 14;
    for(var i=0;i<=cols;i++){
      var xx = -hw + (COURT_W*i/cols);
      npts.push(new THREE.Vector3(xx,0,0), new THREE.Vector3(xx,netH,0));
    }
    var rows = 4;
    for(var r=0;r<=rows;r++){
      var yy = netH*r/rows;
      npts.push(new THREE.Vector3(-hw,yy,0), new THREE.Vector3(hw,yy,0));
    }
    var netGrid = new THREE.LineSegments(
      new THREE.BufferGeometry().setFromPoints(npts), netLineMat);
    grp.add(netGrid);
    /* bright net tape (top) */
    var tape = makeLine(-hw,0,hw,0,netH);
    grp.add(tape);
    /* net posts */
    var postMat = new THREE.MeshStandardMaterial({ color:0x0071e3, roughness:0.4, metalness:0.2, emissive:0x0a3a78, emissiveIntensity:0.35 });
    [-hw,hw].forEach(function(px){
      var post = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,netH+0.18,12), postMat);
      post.position.set(px,(netH+0.18)/2,0);
      grp.add(post);
    });
  }

  /* =========================================================
     FLOATING ISLAND FACTORY
     Each court rides its own slab platform that bobs & turns.
     ========================================================= */
  var SLAB_W = COURT_W + 3.2;   // platform footprint, larger than court
  var SLAB_L = COURT_L + 3.2;
  var SLAB_T = 1.3;             // slab thickness

  function buildIsland(cx, cz, baseY, yaw){
    /* outer wrapper: bobs vertically + drifts in yaw */
    var island = new THREE.Group();
    island.position.set(cx, baseY, cz);
    island.rotation.y = yaw;

    /* ---- Slab platform: thin extruded box, light top / soft blue under ---- */
    var slab = new THREE.Group();
    island.add(slab);

    /* top surface (very-light) */
    var topMat = new THREE.MeshStandardMaterial({
      color:0xfbfdff, roughness:0.7, metalness:0.0
    });
    /* sides (soft blue) */
    var sideMat = new THREE.MeshStandardMaterial({
      color:0xc9def8, roughness:0.85, metalness:0.0
    });
    /* underside (deeper soft blue, slight emissive lift) */
    var underMat = new THREE.MeshStandardMaterial({
      color:0x9cc2f0, roughness:0.9, metalness:0.0,
      emissive:0x2f6fc0, emissiveIntensity:0.12
    });
    /* BoxGeometry face order: +x,-x,+y(top),-y(bottom),+z,-z */
    var slabMats = [ sideMat, sideMat, topMat, underMat, sideMat, sideMat ];
    var slabMesh = new THREE.Mesh(new THREE.BoxGeometry(SLAB_W, SLAB_T, SLAB_L), slabMats);
    slabMesh.position.y = -SLAB_T/2 - 0.02; // top of slab sits just under court y=0
    slab.add(slabMesh);

    /* tapered "root" beneath the slab so islands feel lifted, not cut */
    var rootMat = new THREE.MeshStandardMaterial({
      color:0x8fbaee, roughness:0.95, metalness:0.0,
      transparent:true, opacity:0.85
    });
    var root = new THREE.Mesh(
      new THREE.ConeGeometry(SLAB_W*0.42, 4.6, 6, 1, true),
      rootMat
    );
    root.rotation.x = Math.PI;            // point downward
    root.position.y = -SLAB_T - 2.3;
    slab.add(root);

    /* faint blue edge ring hugging the slab top for a premium rim-light */
    var rimMat = new THREE.MeshBasicMaterial({ color:BLUE, transparent:true, opacity:0.10, side:THREE.DoubleSide });
    var rim = new THREE.Mesh(
      new THREE.RingGeometry(Math.max(SLAB_W,SLAB_L)*0.55, Math.max(SLAB_W,SLAB_L)*0.58, 80),
      rimMat
    );
    rim.rotation.x = -Math.PI/2;
    rim.position.y = 0.03;
    slab.add(rim);

    /* ---- The actual court (surface + glowing lines + net) on top ---- */
    var court = new THREE.Group();
    buildCourtLines(court);
    slab.add(court);

    /* ---- Soft downward contact-glow so the island reads as floating ---- */
    var glow = new THREE.Mesh(
      new THREE.PlaneGeometry(SLAB_W*1.5, SLAB_L*1.5),
      new THREE.MeshBasicMaterial({
        color:BLUE, transparent:true, opacity:0.10,
        side:THREE.DoubleSide, depthWrite:false, fog:false
      })
    );
    glow.rotation.x = -Math.PI/2;
    glow.position.y = -SLAB_T - 5.2;       // floats below the root
    island.add(glow);

    return island;
  }

  /* =========================================================
     LAY OUT THE FLOATING CLUSTER
     Loose 2x2 footprint, each at a DIFFERENT height + slight yaw.
     ========================================================= */
  var GX = (SLAB_W/2) + 3.6;   // half-gap on x
  var GZ = (SLAB_L/2) + 3.0;   // half-gap on z

  var islandDefs = [
    { x:-GX, z:-GZ, baseY:  0.0, yaw: 0.10, phase:0.0,  speed:0.62, amp:0.55, rotAmp:0.040 },
    { x: GX, z:-GZ, baseY: -1.5, yaw:-0.13, phase:1.7,  speed:0.54, amp:0.70, rotAmp:0.032 },
    { x:-GX, z: GZ, baseY:  1.2, yaw:-0.07, phase:3.1,  speed:0.70, amp:0.48, rotAmp:0.046 },
    { x: GX, z: GZ, baseY: -0.8, yaw: 0.16, phase:4.4,  speed:0.58, amp:0.62, rotAmp:0.036 }
  ];

  var islands = [];
  islandDefs.forEach(function(d){
    var isl = buildIsland(d.x, d.z, d.baseY, d.yaw);
    isl.userData = d;
    scene.add(isl);
    islands.push(isl);
  });

  /* =========================================================
     DRIFTING CLOUD-PUFFS for sky ambiance
     Soft, low-opacity white spheres slowly drifting through the air.
     ========================================================= */
  var clouds = [];
  var cloudMatA = new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:0.55, fog:false });
  var cloudMatB = new THREE.MeshBasicMaterial({ color:0xeef6ff, transparent:true, opacity:0.42, fog:false });
  function makePuff(cx, cy, cz, scale, mat){
    var puff = new THREE.Group();
    var blobs = [
      [0,0,0,1.0],[1.1,-0.15,0.2,0.8],[-1.0,-0.1,-0.2,0.75],
      [0.4,0.35,0.5,0.65],[-0.5,0.25,-0.4,0.6]
    ];
    blobs.forEach(function(b){
      var s = new THREE.Mesh(new THREE.SphereGeometry(1.0, 14, 12), mat);
      s.position.set(b[0],b[1],b[2]);
      s.scale.setScalar(b[3]);
      puff.add(s);
    });
    puff.position.set(cx, cy, cz);
    puff.scale.setScalar(scale);
    return puff;
  }
  var cloudDefs = [
    { x:-34, y: 10, z:-18, s:3.2, mat:cloudMatA, drift:0.8 },
    { x: 30, y: 13, z:-30, s:4.0, mat:cloudMatB, drift:0.55 },
    { x: 38, y:  6, z: 20, s:3.0, mat:cloudMatA, drift:0.7 },
    { x:-30, y:  8, z: 28, s:3.6, mat:cloudMatB, drift:0.5 },
    { x:  2, y: 18, z:-40, s:4.4, mat:cloudMatA, drift:0.4 },
    { x: -6, y: -9, z: 36, s:3.4, mat:cloudMatB, drift:0.6 }
  ];
  cloudDefs.forEach(function(c){
    var p = makePuff(c.x, c.y, c.z, c.s, c.mat);
    p.userData = c;
    scene.add(p);
    clouds.push(p);
  });

  /* =========================================================
     RENDER LOOP — slow auto-orbit + dreamy island bobbing
     ========================================================= */
  var angle = Math.PI * 0.18;
  var RADIUS = 38;
  var BASE_HEIGHT = 21;        // a touch higher: look slightly down on the cluster
  var HEIGHT = BASE_HEIGHT;
  var clock = new THREE.Clock();
  var elapsed = 0;

  function positionCamera(){
    camera.position.set(
      Math.cos(angle) * RADIUS,
      HEIGHT,
      Math.sin(angle) * RADIUS
    );
    camera.lookAt(CENTER);
  }

  function animateWorld(){
    /* gently bob + slowly turn each island */
    for(var i=0;i<islands.length;i++){
      var isl = islands[i];
      var d = isl.userData;
      var bob = Math.sin(elapsed * d.speed + d.phase) * d.amp;
      isl.position.y = d.baseY + bob;
      isl.rotation.y = d.yaw + Math.sin(elapsed * d.speed * 0.5 + d.phase) * d.rotAmp;
    }
    /* drift cloud-puffs slowly, wrapping across the sky */
    for(var c=0;c<clouds.length;c++){
      var cl = clouds[c];
      var cd = cl.userData;
      cl.position.x += cd.drift * 0.02;
      if(cl.position.x > 52) cl.position.x = -52;
      cl.position.y = cd.y + Math.sin(elapsed * 0.25 + c) * 0.6;
    }
  }

  function frame(){
    var dt = clock.getDelta();
    if(!reduceMotion){
      elapsed += dt;
      angle += dt * 0.06; // gentle cinematic orbit
      HEIGHT = BASE_HEIGHT + Math.sin(angle*0.6) * 1.6; // subtle vertical breathing
      animateWorld();
    }
    positionCamera();
    renderer.render(scene, camera);
    if(!reduceMotion) requestAnimationFrame(frame);
  }

  /* ---- Resize ---- */
  function onResize(){
    var w = window.innerWidth, h = window.innerHeight;
    camera.aspect = w/h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  }
  window.addEventListener('resize', onResize);

  positionCamera();
  if(reduceMotion){
    animateWorld();                 // settle islands at their resting offsets
    positionCamera();
    renderer.render(scene, camera); // freeze: render one frame
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
