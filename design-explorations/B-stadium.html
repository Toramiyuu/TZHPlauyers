<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TZH · Direction B — Stadium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#070708;
    --panel:#0d0e10;
    --line:#ffffff12;
    --line-2:#ffffff0a;
    --white:#f4f6f5;
    --grey:#8b8f8c;
    --acid:#27e27e;          /* electric broadcast green */
    --acid-dim:#27e27e22;
  }
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--white);overflow:hidden;
    font-family:"Archivo",system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  }
  .mono{font-family:"Space Mono",monospace}
  .stage{position:relative;height:100vh;width:100vw;display:flex;flex-direction:column;
    background:
      radial-gradient(120% 90% at 50% -20%, #14241b 0%, transparent 55%),
      var(--bg);}
  /* armory-style vertical column rules + dot grid */
  .grid{position:absolute;inset:0;pointer-events:none;
    background-image:
      linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:25% 100%;}
  .dots{position:absolute;inset:0;pointer-events:none;opacity:.5;
    background-image:radial-gradient(var(--line-2) 1px,transparent 1px);background-size:22px 22px}

  header{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;
    padding:22px clamp(28px,3vw,48px);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:13px;font-weight:800;font-size:19px;letter-spacing:-.01em;text-transform:uppercase}
  .brand .mk{width:26px;height:26px;display:grid;place-items:center;flex-shrink:0}
  .brand .mk svg{width:26px;height:26px}
  .brand b{font-weight:900}.brand span{color:var(--grey);font-weight:600}
  .hdr-right{display:flex;align-items:center;gap:18px}
  .pill{font-family:"Space Mono",monospace;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--grey)}
  .live{display:inline-flex;align-items:center;gap:9px;font-family:"Space Mono",monospace;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--acid)}
  .live .dot{width:8px;height:8px;border-radius:50%;background:var(--acid);box-shadow:0 0 10px var(--acid);animation:beat 1.6s infinite}
  @keyframes beat{0%,100%{opacity:1}50%{opacity:.25}}

  .courts{position:relative;z-index:2;flex:1;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
  .court{position:relative;background:linear-gradient(180deg,#0c0d0f,#070708);overflow:hidden;
    display:flex;flex-direction:column;justify-content:center;padding:clamp(28px,3.4vw,60px)}
  .ghost{position:absolute;right:-2%;top:50%;transform:translateY(-50%);font-weight:900;
    font-size:clamp(280px,34vw,520px);line-height:.7;color:#ffffff05;letter-spacing:-.04em;pointer-events:none;user-select:none}
  .court-top{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;margin-bottom:auto}
  .court-lbl{font-family:"Space Mono",monospace;font-size:13px;letter-spacing:.32em;text-transform:uppercase;color:var(--grey)}
  .court-lbl b{color:var(--white)}
  .status{font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--acid);border:1px solid var(--acid-dim);background:var(--acid-dim);padding:4px 10px;border-radius:3px}

  .matchup{position:relative;z-index:2;display:flex;flex-direction:column;gap:clamp(10px,1.4vw,18px);margin:auto 0}
  .side{display:flex;flex-direction:column;gap:2px}
  .player{font-weight:800;font-size:clamp(34px,4.6vw,62px);line-height:1.0;letter-spacing:-.02em;text-transform:uppercase}
  .player.dim{color:var(--white)}
  .side.b .player{font-weight:600;color:#cfd3d0}
  .vsrow{display:flex;align-items:center;gap:20px;margin:clamp(6px,1vw,14px) 0}
  .vsrow .bar{height:2px;flex:1;background:linear-gradient(90deg,var(--acid),transparent)}
  .vsrow .vs{font-weight:900;font-size:clamp(30px,3.6vw,52px);color:var(--acid);letter-spacing:.02em;line-height:1}
  .seedline{font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.2em;color:#5f635f;text-transform:uppercase;margin-top:2px}

  footer{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;
    padding:16px clamp(28px,3vw,48px);border-top:1px solid var(--line);
    font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--grey)}
  footer .r{display:flex;gap:24px}
</style>
</head>
<body>
<div class="stage">
  <div class="grid"></div>
  <div class="dots"></div>

  <header>
    <div class="brand">
      <span class="mk"><svg viewBox="0 0 24 24" fill="none"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z" fill="#27e27e"/></svg></span>
      <b>TZH</b>&nbsp;<span>BADMINTON</span>
    </div>
    <div class="hdr-right">
      <span class="pill">Mon · 9 Jun 2026</span>
      <span class="live"><span class="dot"></span>Round 01 · Live</span>
    </div>
  </header>

  <div class="courts">
    <!-- COURT 1 -->
    <section class="court">
      <div class="ghost">01</div>
      <div class="court-top">
        <span class="court-lbl">Court <b>01</b></span>
        <span class="status">In Play</span>
      </div>
      <div class="matchup">
        <div class="side a">
          <div class="player dim">Thomas</div>
          <div class="player dim">Desmond</div>
        </div>
        <div class="vsrow"><span class="vs">VS</span><span class="bar"></span></div>
        <div class="side b">
          <div class="player">Celine</div>
          <div class="player">Sharmin</div>
        </div>
      </div>
    </section>

    <!-- COURT 2 -->
    <section class="court">
      <div class="ghost">02</div>
      <div class="court-top">
        <span class="court-lbl">Court <b>02</b></span>
        <span class="status">In Play</span>
      </div>
      <div class="matchup">
        <div class="side a">
          <div class="player dim">Terence</div>
          <div class="player dim">Alex</div>
        </div>
        <div class="vsrow"><span class="vs">VS</span><span class="bar"></span></div>
        <div class="side b">
          <div class="player">Kokyan</div>
          <div class="player">Yit Fung</div>
        </div>
      </div>
    </section>
  </div>

  <footer>
    <span>TZH BADMINTON — LIVE COURT DISPLAY</span>
    <div class="r"><span>2 COURTS</span><span>8 PLAYERS</span><span>MEMBERS ONLY</span></div>
  </footer>
</div>
</body>
</html>
