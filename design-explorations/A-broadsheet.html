<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TZH · Direction A — Broadsheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --paper:#f3efe6;        /* warm broadsheet paper */
    --paper-2:#ece7da;
    --ink:#17160f;          /* near-black ink */
    --ink-2:#56524444;
    --rule:#1716131f;       /* hairline */
    --rule-strong:#171613;
    --green:#0c5a37;        /* deep ink-green, the single restrained accent */
    --muted:#6c6656;
  }
  html,body{height:100%}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Fraunces",Georgia,serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  .stage{position:relative;height:100vh;width:100vw;padding:clamp(28px,3.4vw,52px) clamp(34px,4vw,68px);display:flex;flex-direction:column}
  /* faint badminton court lines as ambient texture */
  .court-motif{position:absolute;inset:0;opacity:.5;pointer-events:none}
  .grain{position:absolute;inset:0;opacity:.32;mix-blend-mode:multiply;pointer-events:none}
  .mono{font-family:"JetBrains Mono",monospace}

  /* ── masthead ── */
  header{display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:14px;border-bottom:1.5px solid var(--rule-strong);position:relative;z-index:2}
  .mast{display:flex;flex-direction:column;gap:4px}
  .eyebrow{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:var(--muted)}
  .mast h1{font-optical-sizing:auto;font-weight:560;font-size:clamp(30px,4.2vw,58px);letter-spacing:-.02em;line-height:.92}
  .mast h1 em{font-style:italic;font-weight:380;color:var(--green)}
  .meta{text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
  .meta .date{font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.12em;color:var(--ink);text-transform:uppercase}
  .live{display:inline-flex;align-items:center;gap:8px;font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--green)}
  .live .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(12,90,55,.5);animation:beat 1.8s infinite}
  @keyframes beat{0%{box-shadow:0 0 0 0 rgba(12,90,55,.45)}70%{box-shadow:0 0 0 7px rgba(12,90,55,0)}100%{box-shadow:0 0 0 0 rgba(12,90,55,0)}}

  /* ── fixtures ── */
  .fixtures{flex:1;display:grid;grid-template-columns:1fr 1px 1fr;gap:0;align-items:stretch;position:relative;z-index:2}
  .vrule{background:var(--rule);width:1px;align-self:stretch;margin:30px 0}
  .fixture{padding:clamp(22px,3vw,46px) clamp(20px,3.2vw,64px);display:flex;flex-direction:column;justify-content:center;gap:clamp(14px,2vw,30px)}
  .court-head{display:flex;align-items:baseline;justify-content:space-between}
  .court-no{font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:var(--muted)}
  .court-no b{color:var(--ink);font-weight:700}
  .round-tag{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--green);border:1px solid var(--rule);padding:4px 10px;border-radius:2px}

  .team{display:flex;flex-direction:column;gap:2px}
  .team .seat{display:flex;align-items:baseline;gap:18px}
  .team .idx{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--muted);width:1.6em;flex-shrink:0;padding-top:.4em}
  .team .name{font-optical-sizing:auto;font-weight:500;font-size:clamp(30px,4vw,54px);letter-spacing:-.018em;line-height:1.02}
  .team.b .name{font-weight:430;font-style:italic}

  .versus{display:flex;align-items:center;gap:18px;margin:2px 0}
  .versus .ln{height:1px;background:var(--rule);flex:1}
  .versus .vs{font-style:italic;font-weight:330;font-size:clamp(26px,3vw,40px);color:var(--green);letter-spacing:0}

  footer{display:flex;align-items:center;justify-content:space-between;padding-top:14px;border-top:1.5px solid var(--rule-strong);font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);position:relative;z-index:2}
  footer .r{display:flex;gap:26px}
</style>
</head>
<body>
<div class="stage">
  <!-- ambient court lines -->
  <svg class="court-motif" viewBox="0 0 1512 820" preserveAspectRatio="xMidYMid slice" fill="none" stroke="#17161310" stroke-width="1.2">
    <rect x="120" y="60" width="1272" height="700"/>
    <line x1="120" y1="410" x2="1392" y2="410"/>
    <line x1="756" y1="60" x2="756" y2="760"/>
    <rect x="120" y="200" width="1272" height="420"/>
    <line x1="300" y1="60" x2="300" y2="760"/>
    <line x1="1212" y1="60" x2="1212" y2="760"/>
  </svg>
  <svg class="grain"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/></filter><rect width="100%" height="100%" filter="url(#g)" opacity="0.4"/></svg>

  <header>
    <div class="mast">
      <span class="eyebrow">Tuen Mun · Members Club</span>
      <h1>TZH <em>Badminton</em></h1>
    </div>
    <div class="meta">
      <span class="date">Mon 9 June 2026</span>
      <span class="live"><span class="dot"></span>Live · Round 01</span>
    </div>
  </header>

  <div class="fixtures">
    <!-- COURT 1 -->
    <section class="fixture">
      <div class="court-head">
        <span class="court-no">Court <b>01</b></span>
        <span class="round-tag">In Play</span>
      </div>
      <div class="team a">
        <div class="seat"><span class="idx">01</span><span class="name">Thomas</span></div>
        <div class="seat"><span class="idx">02</span><span class="name">Desmond</span></div>
      </div>
      <div class="versus"><span class="vs">versus</span><span class="ln"></span></div>
      <div class="team b">
        <div class="seat"><span class="idx">03</span><span class="name">Celine</span></div>
        <div class="seat"><span class="idx">04</span><span class="name">Sharmin</span></div>
      </div>
    </section>

    <div class="vrule"></div>

    <!-- COURT 2 -->
    <section class="fixture">
      <div class="court-head">
        <span class="court-no">Court <b>02</b></span>
        <span class="round-tag">In Play</span>
      </div>
      <div class="team a">
        <div class="seat"><span class="idx">01</span><span class="name">Terence</span></div>
        <div class="seat"><span class="idx">02</span><span class="name">Alex</span></div>
      </div>
      <div class="versus"><span class="vs">versus</span><span class="ln"></span></div>
      <div class="team b">
        <div class="seat"><span class="idx">03</span><span class="name">Kokyan</span></div>
        <div class="seat"><span class="idx">04</span><span class="name">Yit&nbsp;Fung</span></div>
      </div>
    </section>
  </div>

  <footer>
    <span>TZH Badminton — Live Court Display</span>
    <div class="r"><span>2 Courts Active</span><span>8 Players</span><span>Members Only</span></div>
  </footer>
</div>
</body>
</html>
